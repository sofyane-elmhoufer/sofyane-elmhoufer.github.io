<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2F4F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C1020" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<title>ML Quest</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style id="basecss">:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<style id="lockcss">
:root{--lk-bg:#F2F4F8;--lk-card:#FFFFFF;--lk-ink:#11162A;--lk-mut:#4A536B;--lk-line:#D5DBE7;--lk-acc:#0B8A7A;--lk-acc-ink:#FFFFFF;--lk-bad:#D63B50;--lk-soft:#E8ECF3}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--lk-bg:#0C1020;--lk-card:#151B30;--lk-ink:#EAEEF8;--lk-mut:#9AA5C2;--lk-line:#2A3354;--lk-acc:#2FD3B8;--lk-acc-ink:#06211C;--lk-bad:#FF6B7F;--lk-soft:#1D2540;color-scheme:dark}}
:root[data-theme="dark"]{--lk-bg:#0C1020;--lk-card:#151B30;--lk-ink:#EAEEF8;--lk-mut:#9AA5C2;--lk-line:#2A3354;--lk-acc:#2FD3B8;--lk-acc-ink:#06211C;--lk-bad:#FF6B7F;--lk-soft:#1D2540;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--lk-bg);color:var(--lk-ink);font:400 15px/1.5 'Figtree',system-ui,sans-serif}
#lock{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#lf{width:100%;max-width:400px;background:var(--lk-card);border:1px solid var(--lk-line);border-radius:18px;padding:26px 22px;display:flex;flex-direction:column;gap:14px}
#lf svg{width:44px;height:44px}
#lf h1{margin:0;font:800 30px/1.05 'Bricolage Grotesque',system-ui,sans-serif;letter-spacing:-.03em}
#lf p{margin:0;color:var(--lk-mut)}
#lf label{font:600 13px 'Figtree',system-ui,sans-serif}
.pwrow{display:flex;gap:8px}
#pw{flex:1;min-width:0;font:500 16px 'JetBrains Mono',ui-monospace,monospace;color:var(--lk-ink);background:var(--lk-bg);border:1.5px solid var(--lk-line);border-radius:10px;padding:12px}
#eye,#inst{font:600 13px 'Figtree',system-ui,sans-serif;color:var(--lk-ink);background:var(--lk-soft);border:1px solid var(--lk-line);border-radius:10px;padding:0 12px;cursor:pointer}
#inst{padding:10px 12px}
.chk{display:flex;gap:10px;align-items:center;font-weight:500!important;color:var(--lk-mut)}
.chk input{width:18px;height:18px;accent-color:var(--lk-acc)}
#go{font:700 16px 'Figtree',system-ui,sans-serif;background:var(--lk-acc);color:var(--lk-acc-ink);border:0;border-radius:10px;padding:13px;cursor:pointer}
#go[disabled]{opacity:.6;cursor:default}
#msg{min-height:1.5em;font-weight:600;color:var(--lk-bad)!important}
#msg.ok{color:var(--lk-mut)!important;font-weight:500}
#lf :focus-visible{outline:2px solid var(--lk-acc);outline-offset:2px}
</style>
</head>
<body>
<main id="lock">
  <form id="lf">
    <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M8.7 10l5 4.4M8.7 22l5-4.4M19.3 16h3.7" stroke="var(--lk-mut)" stroke-width="1.6" fill="none" stroke-linecap="round"/><circle cx="6" cy="9" r="3" fill="#7AA2FF"/><circle cx="6" cy="23" r="3" fill="#7AA2FF"/><circle cx="16" cy="16" r="3.5" fill="var(--lk-acc)"/><circle cx="26" cy="16" r="3" fill="#F5B547"/></svg>
    <h1>ML Quest</h1>
    <p>Le contenu est chiffré. Saisis le mot de passe pour le déverrouiller.</p>
    <label for="pw">Mot de passe</label>
    <div class="pwrow"><input id="pw" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" required><button type="button" id="eye" aria-label="Afficher ou masquer le mot de passe">Afficher</button></div>
    <label class="chk"><input type="checkbox" id="rem"> Rester connecté sur cet appareil</label>
    <button id="go" type="submit">Déverrouiller</button>
    <p id="msg" role="alert"></p>
    <button type="button" id="inst" hidden>Installer l'app</button>
  </form>
</main>
<script>
(function(){
  'use strict';
  var K='mlq.key',enc=new TextEncoder(),dec=new TextDecoder(),pack=null,dp=null;
  var $=function(s){return document.querySelector(s)};
  var fromB64=function(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})};
  var toB64=function(u){var s='';for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)};
  function getPack(){return pack||(pack=fetch('content.enc.json').then(function(r){if(!r.ok)throw new Error('http');return r.json()}))}
  async function derive(pw,p){
    var base=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);
    return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:fromB64(p.salt),iterations:p.iter,hash:'SHA-256'},base,256));
  }
  async function decrypt(raw,p){
    var key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
    return JSON.parse(dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:fromB64(p.iv)},key,fromB64(p.data))));
  }
  function placeInstall(){
    if(!dp)return;
    var host=$('.top'),b=$('#inst');
    if(host&&!host.contains(b||document.body)){if(b)b.remove();b=document.createElement('button');b.id='inst';b.className='btn sm pri';b.textContent="Installer l'app";host.appendChild(b)}
    else if(b)b.hidden=false;
    if(b)b.onclick=async function(){dp.prompt();try{await dp.userChoice}catch(e){}dp=null;b.remove()};
  }
  function start(payload){
    var css=document.createElement('style');css.id='appcss';css.textContent=payload.css;document.head.appendChild(css);
    $('#lockcss').remove();$('#lock').remove();
    document.body.insertAdjacentHTML('afterbegin',payload.body);
    var js=document.createElement('script');js.textContent=payload.js;document.body.appendChild(js);
    var top=$('.top');
    if(top){var b=document.createElement('button');b.className='btn sm';b.textContent='Verrouiller';
      b.onclick=function(){try{localStorage.removeItem(K)}catch(e){}location.reload()};top.appendChild(b)}
    placeInstall();
  }
  addEventListener('beforeinstallprompt',function(e){e.preventDefault();dp=e;placeInstall()});
  addEventListener('appinstalled',function(){var b=$('#inst');if(b)b.remove();dp=null});
  if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}

  /* Reconnexion automatique si l'utilisateur a coché « Rester connecté » */
  (async function(){
    var k=null;try{k=localStorage.getItem(K)}catch(e){}
    if(!k||!(window.crypto&&crypto.subtle))return;
    try{start(await decrypt(fromB64(k),await getPack()))}
    catch(e){try{localStorage.removeItem(K)}catch(_){}}
  })();

  var form=$('#lf'),msg=$('#msg'),go=$('#go'),pw=$('#pw');
  $('#eye').onclick=function(){var s=pw.type==='password';pw.type=s?'text':'password';this.textContent=s?'Masquer':'Afficher'};
  form.addEventListener('submit',function(ev){
    ev.preventDefault();
    if(!(window.crypto&&crypto.subtle)){msg.className='';msg.textContent='Le déverrouillage nécessite une connexion sécurisée (HTTPS).';return}
    go.disabled=true;msg.className='ok';msg.textContent='Déchiffrement en cours…';
    setTimeout(async function(){
      var p;
      try{p=await getPack()}catch(e){pack=null;go.disabled=false;msg.className='';msg.textContent='Impossible de charger le contenu. Vérifie ta connexion.';return}
      try{
        var raw=await derive(pw.value,p),payload=await decrypt(raw,p);
        if($('#rem').checked){try{localStorage.setItem(K,toB64(raw))}catch(e){}}
        start(payload);
      }catch(e){go.disabled=false;msg.className='';msg.textContent='Mot de passe incorrect.';pw.select()}
    },40);
  });
})();
</script>
</body>
</html>
