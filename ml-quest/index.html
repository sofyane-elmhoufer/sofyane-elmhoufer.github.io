<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2F4F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C1020" media="(prefers-color-scheme: dark)">
<meta name="description" content="Apprendre le machine learning en s'amusant : cours, jeux, cartes, QCM et code Python.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>ML Quest</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout : appli mobile-first, 5 onglets (barre basse sur téléphone, barre haute sur grand écran),
   contenu en cartes et visualisations SVG interactives, XP et niveaux en en-tête. */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --surface-2:#E8ECF3; --ink:#11162A; --ink-2:#4A536B; --line:#D5DBE7;
  --accent:#0B8A7A; --accent-ink:#FFFFFF; --accent-soft:#D3F1EC; --accent-strong:#0A6B5F;
  --warn:#E8921A; --warn-soft:#FCEBCB; --bad:#D63B50; --bad-soft:#FADADF; --good:#1B8F4E; --good-soft:#D6F0E0;
  --blue:#3B6FE0; --blue-soft:#DCE6FB;
  --code-bg:#0F1424; --code-fg:#E6EAF5; --tk-k:#C792EA; --tk-s:#A5E075; --tk-c:#7C87AB; --tk-n:#F2B26B; --tk-f:#7FB4FF;
  --display:'Bricolage Grotesque',system-ui,sans-serif; --body:'Figtree',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace; --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1020; --surface:#151B30; --surface-2:#1D2540; --ink:#EAEEF8; --ink-2:#9AA5C2; --line:#2A3354;
  --accent:#2FD3B8; --accent-ink:#06211C; --accent-soft:#12383A; --accent-strong:#2FD3B8;
  --warn:#F5B547; --warn-soft:#3A2F17; --bad:#FF6B7F; --bad-soft:#3F1B24; --good:#43D17F; --good-soft:#143324;
  --blue:#7AA2FF; --blue-soft:#1C2A52; --code-bg:#070A16; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0C1020; --surface:#151B30; --surface-2:#1D2540; --ink:#EAEEF8; --ink-2:#9AA5C2; --line:#2A3354;
  --accent:#2FD3B8; --accent-ink:#06211C; --accent-soft:#12383A; --accent-strong:#2FD3B8;
  --warn:#F5B547; --warn-soft:#3A2F17; --bad:#FF6B7F; --bad-soft:#3F1B24; --good:#43D17F; --good-soft:#143324;
  --blue:#7AA2FF; --blue-soft:#1C2A52; --code-bg:#070A16; color-scheme:dark;}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--body);
  padding-block:12px 100px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,h4{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.015em;line-height:1.15}
p{margin:0}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--accent-strong);outline-offset:2px}
.app{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.app>*,.app main>*{min-width:0}

/* En-tête */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font:800 23px var(--display);letter-spacing:-.03em}
.brand svg{width:32px;height:32px}
.lvl{display:flex;align-items:center;gap:10px;flex:1 1 240px;max-width:360px;margin-left:auto;min-width:0}
.badge{font:700 12px var(--mono);background:var(--ink);color:var(--bg);padding:3px 8px;border-radius:6px;white-space:nowrap}
.xpbar{flex:1;height:9px;background:var(--surface-2);border-radius:99px;overflow:hidden;min-width:50px}
.xpbar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .6s}
.xptxt{font:500 12px var(--mono);color:var(--ink-2);white-space:nowrap}

/* Navigation */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;background:var(--surface);
  border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs button{background:none;border:0;color:var(--ink-2);display:flex;flex-direction:column;align-items:center;gap:3px;font:600 11px var(--body);padding:7px 2px;border-radius:10px;cursor:pointer}
.tabs button[aria-selected=true]{color:var(--accent-strong);background:var(--accent-soft)}
.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media(min-width:760px){
  body{padding-bottom:48px}
  .tabs{position:static;border:1px solid var(--line);border-radius:16px;padding:6px;gap:6px}
  .tabs button{flex-direction:row;justify-content:center;gap:8px;font-size:14px;padding:11px}
}

/* Titres et texte */
.kicker{font:600 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.title{font:800 clamp(26px,6vw,36px)/1.05 var(--display);letter-spacing:-.025em}
.lead{color:var(--ink-2);max-width:64ch}
.sec{display:flex;flex-direction:column;gap:12px}
.head{display:flex;flex-direction:column;gap:6px;padding:6px 0 2px}
h3{font-size:19px}
.mut{color:var(--ink-2)}
.mono{font-family:var(--mono)}
code.i{font:500 .9em var(--mono);background:var(--surface-2);padding:1px 6px;border-radius:6px}

/* Cartes, vignettes, boutons */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.viz{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px}
.viz svg{display:block;width:100%;height:auto;touch-action:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.btn{font:600 14px var(--body);padding:10px 15px;min-height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{min-height:34px;padding:6px 11px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:default}
.chip{padding:7px 13px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 13px var(--body);cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chips .chip{flex:none}
.note{border-radius:12px;padding:12px 14px;background:var(--warn-soft)}
.note.tip{background:var(--accent-soft)}
.note.bad{background:var(--bad-soft)}
.note b{font-weight:700}

/* Parcours de leçons */
.path{display:grid;gap:10px}
.lesson{display:grid;grid-template-columns:46px 1fr auto;gap:14px;align-items:center;text-align:left;width:100%;cursor:pointer;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.lesson:hover{border-color:var(--accent)}
.lesson .num{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font:800 19px var(--display);background:var(--surface-2)}
.lesson.done .num{background:var(--accent);color:var(--accent-ink)}
.lesson b{font:700 17px var(--display);display:block}
.lesson span.s{color:var(--ink-2);font-size:14px}
.lesson .min{font:500 12px var(--mono);color:var(--ink-2)}

/* Tableaux */
.tblw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:14px}
th{background:var(--surface-2);text-align:left;font:600 11.5px var(--mono);text-transform:uppercase;letter-spacing:.05em;padding:10px 12px}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:top}
.tblw.sm table{min-width:0;font-size:13px}
td.na{background:var(--bad-soft)} td.ok{background:var(--good-soft)}

/* Curseurs et chiffres */
.ctl{display:grid;grid-template-columns:auto 1fr 56px;gap:10px;align-items:center;font:500 13px var(--mono)}
.ctl output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent);min-width:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}
.stat{background:var(--surface-2);border-radius:10px;padding:9px 12px}
.stat b{display:block;font:700 22px var(--display);font-variant-numeric:tabular-nums}
.stat span{font:500 11px var(--mono);color:var(--ink-2);text-transform:uppercase;letter-spacing:.04em}
.bar{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .4s}

/* SVG */
svg .gl{stroke:var(--line);stroke-width:1}
svg .tx{fill:var(--ink-2);font:500 11px var(--mono)}
svg .tx.c{text-anchor:middle}
svg .cA{fill:var(--blue)} svg .cB{fill:var(--warn)} svg .cC{fill:var(--accent)}
svg .ln{stroke:var(--accent);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
svg .res{stroke:var(--bad);stroke-width:1.6;stroke-dasharray:3 3}
svg .flow{stroke:var(--accent);stroke-width:2.5;fill:none;stroke-dasharray:6 6;animation:flow 1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-24}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.6s ease-in-out infinite}

/* Code */
.code{background:var(--code-bg);color:var(--code-fg);border-radius:12px;overflow:hidden}
.code header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 8px 7px 14px;border-bottom:1px solid rgba(255,255,255,.09);font:500 12px var(--mono);color:#98A3C4}
.code header .btn{background:rgba(255,255,255,.08);border-color:transparent;color:#E6EAF5;min-height:30px;padding:4px 10px;font-size:12px}
.code pre{margin:0;padding:12px 14px;overflow-x:auto;font:400 13px/1.65 var(--mono);tab-size:4}
.tk-k{color:var(--tk-k)} .tk-s{color:var(--tk-s)} .tk-c{color:var(--tk-c);font-style:italic} .tk-n{color:var(--tk-n)} .tk-f{color:var(--tk-f)}
details.snip{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
details.snip>summary{cursor:pointer;list-style:none;padding:14px 16px;display:flex;gap:12px;align-items:center;font:700 16px var(--display)}
details.snip>summary::-webkit-details-marker{display:none}
details.snip>summary .tag{margin-left:auto;font:500 11px var(--mono);color:var(--ink-2);background:var(--surface-2);padding:3px 8px;border-radius:6px;white-space:nowrap}
details.snip>summary::before{content:"+";font:600 18px var(--mono);color:var(--accent-strong);width:18px}
details.snip[open]>summary::before{content:"–"}
details.snip .body{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}

/* Cartes mémoire */
.fc{perspective:1200px;height:250px;cursor:pointer}
.fc-in{position:relative;width:100%;height:100%;transition:transform .55s;transform-style:preserve-3d}
.fc.flip .fc-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;padding:22px;display:flex;flex-direction:column;justify-content:center;gap:10px;border:1px solid var(--line);background:var(--surface);overflow:auto}
.face.back{transform:rotateY(180deg);background:var(--accent-soft)}
.face .q{font:700 21px/1.25 var(--display)}
.face .cat{font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.boxes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.boxes div{background:var(--surface-2);border-radius:10px;padding:8px 10px;font:500 12px var(--mono);color:var(--ink-2)}
.boxes b{display:block;font:700 20px var(--display);color:var(--ink)}

/* QCM */
.opt{display:block;width:100%;text-align:left;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:500 15px/1.4 var(--body);cursor:pointer}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.good{border-color:var(--good);background:var(--good-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opts{display:grid;gap:9px}

/* Jeu */
.big{font:800 54px/1 var(--display);font-variant-numeric:tabular-nums}
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.flash-ok{animation:fok .4s} .flash-no{animation:fno .4s}
@keyframes fok{0%{box-shadow:0 0 0 0 var(--good)}100%{box-shadow:0 0 0 14px transparent}}
@keyframes fno{0%{box-shadow:0 0 0 0 var(--bad)}100%{box-shadow:0 0 0 14px transparent}}
textarea,input[type=text]{width:100%;font:400 15px var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}

.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translateX(-50%);z-index:50;background:var(--ink);color:var(--bg);
  padding:10px 18px;border-radius:99px;font:600 14px var(--body);box-shadow:0 8px 24px rgba(0,0,0,.25);animation:pop .3s;white-space:nowrap}
@keyframes pop{from{transform:translate(-50%,-14px);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head><body>
<div class="app">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M8.7 10l5 4.4M8.7 22l5-4.4M19.3 16h3.7" stroke="var(--ink-2)" stroke-width="1.6" fill="none" stroke-linecap="round"/><circle cx="6" cy="9" r="3" fill="var(--blue)"/><circle cx="6" cy="23" r="3" fill="var(--blue)"/><circle cx="16" cy="16" r="3.5" fill="var(--accent)"/><circle cx="26" cy="16" r="3" fill="var(--warn)"/></svg>
      ML Quest
    </div>
    <div class="lvl"><span class="badge" id="lvl">NIV 1</span><div class="xpbar"><i id="xpFill" style="width:0"></i></div><span class="xptxt" id="xpTxt">0 XP</span></div>
  </header>
  <nav class="tabs" id="nav" role="tablist" aria-label="Sections">
    <button role="tab" data-t="cours" aria-selected="true"><svg viewBox="0 0 24 24"><path d="M4 19.5V5a2 2 0 0 1 2-2h13v14H6.5A2.5 2.5 0 0 0 4 19.5zM4 19.5A2.5 2.5 0 0 0 6.5 22H19v-5"/></svg>Cours</button>
    <button role="tab" data-t="jeu" aria-selected="false"><svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="11" rx="5"/><path d="M7 12.5h4M9 10.5v4"/><circle cx="16" cy="11.5" r=".7"/><circle cx="18.3" cy="14" r=".7"/></svg>Jeu</button>
    <button role="tab" data-t="cartes" aria-selected="false"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="14" height="13" rx="2"/><path d="M7 7V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-2"/></svg>Cartes</button>
    <button role="tab" data-t="qcm" aria-selected="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.8 2.8L16.5 9.5"/></svg>QCM</button>
    <button role="tab" data-t="code" aria-selected="false"><svg viewBox="0 0 24 24"><path d="m8 8-5 4 5 4M16 8l5 4-5 4M14 5l-4 14"/></svg>Code</button>
  </nav>
  <main id="view"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script>
/* ===== Noyau : état, XP, routage, aides ===== */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function gauss(r){let u=0;while(!u)u=r();const v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
const scale=(d0,d1,r0,r1)=>v=>r0+(v-d0)/(d1-d0)*(r1-r0);
const f1=v=>(Math.round(v*10)/10).toFixed(1), f2=v=>(Math.round(v*100)/100).toFixed(2);

const KEY='mlquest.v1';
let S={xp:0,lessons:{},cards:{},quiz:{best:0,done:{}},notes:[],game:{line:{},blitz:0},drill:{}};
try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(d)S=Object.assign(S,d)}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

const LV=['Curieux','Apprenti','Praticien','Explorateur','Ingénieur','Architecte','Maître'];
function level(){const l=Math.floor(S.xp/150);return{n:l+1,name:LV[Math.min(l,LV.length-1)],cur:S.xp%150}}
function renderHead(){const l=level();$('#lvl').textContent='NIV '+l.n+' · '+l.name;$('#xpFill').style.width=(l.cur/150*100)+'%';$('#xpTxt').textContent=S.xp+' XP'}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>{t.hidden=true},2300)}
function addXP(n,why){if(n<=0)return;S.xp+=n;save();renderHead();toast('+'+n+' XP · '+why)}

/* Coloration Python */
function hl(code){
  return esc(code).replace(/(#.*$)|('[^'\n]*'|"[^"\n]*")|\b(import|from|as|def|return|for|in|if|else|elif|True|False|None|with|class|lambda|not|and|or)\b|\b(\d+(?:\.\d+)?)\b|\b([A-Za-z_]\w*)(?=\()/gm,
    (m,c,s,k,n,f)=>c?`<span class="tk-c">${c}</span>`:s?`<span class="tk-s">${s}</span>`:k?`<span class="tk-k">${k}</span>`:n?`<span class="tk-n">${n}</span>`:`<span class="tk-f">${f}</span>`);
}
const CODES=[];
function codeBlock(code,label){CODES.push(code);return `<div class="code"><header><span>${esc(label||'python')}</span><button class="btn sm" data-copy="${CODES.length-1}">Copier</button></header><pre><code>${hl(code)}</code></pre></div>`}
function copyText(txt,b){
  const ok=()=>{b.textContent='Copié';setTimeout(()=>{b.textContent='Copier'},1400)};
  const fb=()=>{const pre=b.closest('.code').querySelector('pre'),r=document.createRange();r.selectNodeContents(pre);const s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent='Sélectionné'};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(ok,fb)}else fb();
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-copy]');if(b)copyText(CODES[+b.dataset.copy],b)});

/* Aides SVG / formulaires */
function svgPt(svg,e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())}
function slider(id,label,min,max,step,val){return `<label class="ctl"><span>${label}</span><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}"><output id="${id}o">${val}</output></label>`}
function stat(label,val,id){return `<div class="stat"><b${id?` id="${id}"`:''}>${val}</b><span>${label}</span></div>`}
function head(kicker,title,lead){return `<div class="head"><div class="kicker">${kicker}</div><h2 class="title">${title}</h2>${lead?`<p class="lead">${lead}</p>`:''}</div>`}

/* Routage par onglets */
const TABS=['cours','jeu','cartes','qcm','code'], VIEWS={};
let cleanup=null;
function go(t){
  if(!TABS.includes(t))t='cours';
  if(cleanup){cleanup();cleanup=null}
  $$('#nav button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.t===t)));
  const v=$('#view');v.innerHTML='';v.onclick=null;v.oninput=null;v.onkeydown=null;VIEWS[t](v);window.scrollTo(0,0);
}
$('#nav').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(location.hash.slice(1)===b.dataset.t)go(b.dataset.t);else location.hash=b.dataset.t;
});
addEventListener('hashchange',()=>go(location.hash.slice(1)));
/* ===== Cours : cadre + leçons 1 et 2 ===== */
const LESSONS=[];
const takeaways=a=>`<div class="note tip"><b>À retenir</b><ul style="margin:6px 0 0;padding-left:20px">${a.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;
const box=(x,y,w,h,t,hi)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8" fill="${hi?'var(--accent-soft)':'var(--surface-2)'}" stroke="${hi?'var(--accent)':'var(--line)'}" stroke-width="1.5"/><text x="${x+w/2}" y="${y+h/2+4.5}" text-anchor="middle" style="fill:var(--ink);font:600 13px var(--body)">${t}</text>`;
const arrow=(x1,y1,x2,y2)=>`<path class="flow" d="M${x1} ${y1}L${x2} ${y2}"/>`;
function mse(pts,w,b){return pts.reduce((a,p)=>a+(p.y-(w*p.x+b))**2,0)/pts.length}
function ols(pts){const n=pts.length,mx=pts.reduce((a,p)=>a+p.x,0)/n,my=pts.reduce((a,p)=>a+p.y,0)/n;let sxy=0,sxx=0;pts.forEach(p=>{sxy+=(p.x-mx)*(p.y-my);sxx+=(p.x-mx)**2});const w=sxy/sxx;return{w,b:my-w*mx}}
function genLine(seed,n,w,b,sd){const r=rng(seed);return Array.from({length:n},()=>{const x=0.6+r()*8.8;return{x,y:Math.max(0.4,Math.min(11.4,w*x+b+gauss(r)*sd))}})}

/* Graphique droite + résidus (partagé avec le jeu) */
const LC={W:640,H:330,l:38,r:14,t:12,b:28};
function lineChart(id,pts,w,b,opt){
  const sx=scale(0,10,LC.l,LC.W-LC.r), sy=scale(0,12,LC.H-LC.b,LC.t);
  let s=`<defs><clipPath id="${id}"><rect x="${LC.l}" y="${LC.t}" width="${LC.W-LC.l-LC.r}" height="${LC.H-LC.t-LC.b}"/></clipPath></defs>`;
  for(let i=0;i<=12;i+=3)s+=`<line class="gl" x1="${LC.l}" x2="${LC.W-LC.r}" y1="${sy(i)}" y2="${sy(i)}"/><text class="tx" x="${LC.l-7}" y="${sy(i)+4}" text-anchor="end">${i}</text>`;
  for(let i=0;i<=10;i+=2)s+=`<line class="gl" y1="${LC.t}" y2="${LC.H-LC.b}" x1="${sx(i)}" x2="${sx(i)}"/><text class="tx c" x="${sx(i)}" y="${LC.H-9}">${i}</text>`;
  s+=`<g clip-path="url(#${id})">`;
  if(opt)s+=`<line x1="${sx(0)}" y1="${sy(opt.b)}" x2="${sx(10)}" y2="${sy(opt.w*10+opt.b)}" stroke="var(--ink-2)" stroke-width="2.2" stroke-dasharray="7 5"/>`;
  pts.forEach(p=>{s+=`<line class="res" x1="${sx(p.x)}" x2="${sx(p.x)}" y1="${sy(p.y)}" y2="${sy(w*p.x+b)}"/>`});
  s+=`<line class="ln" x1="${sx(0)}" y1="${sy(b)}" x2="${sx(10)}" y2="${sy(w*10+b)}"/></g>`;
  pts.forEach(p=>{s+=`<circle class="cA" cx="${sx(p.x)}" cy="${sy(p.y)}" r="5.5"/>`});
  return s;
}

LESSONS.push({id:'regression',title:'Régression linéaire',sub:'Tracer la meilleure droite, puis la laisser la trouver seule',min:7,render(el){
  const P=genLine(7,14,0.8,1.5,0.9),O=ols(P),best=mse(P,O.w,O.b);
  let w=0.2,b=7,hist=[],timer=null,showOpt=false;
  el.innerHTML=`<p class="lead">Le modèle est une droite <code class="i">ŷ = w·x + b</code>. L'erreur se mesure par la <b>MSE</b> : la moyenne des carrés des écarts (les traits rouges). Entraîner, c'est trouver w et b qui la minimisent.</p>
  <div class="viz"><svg id="lsv" viewBox="0 0 ${LC.W} ${LC.H}" role="img" aria-label="Nuage de points et droite de régression"></svg></div>
  <div class="card sec">${slider('lw','pente w',-1,3,0.05,w)}${slider('lb','décalage b',-2,8,0.1,b)}</div>
  <div class="stats">${stat('MSE actuelle','','sM')}${stat('MSE minimale',f2(best))}${stat('w','','sW')}${stat('b','','sB')}</div>
  <div class="card sec"><h3>Laisser la machine apprendre</h3><p class="mut">La descente de gradient corrige w et b par petits pas, toujours dans le sens qui réduit l'erreur. Le pas s'appelle le <b>taux d'apprentissage</b>. Essaie de l'augmenter jusqu'à faire diverger l'entraînement.</p>
  ${slider('llr','taux',0.002,0.04,0.002,0.016)}
  <div class="row"><button class="btn pri" data-a="gd">Lancer la descente</button><button class="btn" data-a="ols">Solution exacte</button><button class="btn" data-a="rst">Réinitialiser</button></div>
  <svg id="lh" viewBox="0 0 640 90" style="width:100%;height:auto" role="img" aria-label="Courbe de la MSE pendant l'entraînement"></svg><p id="lmsg" class="mut" style="min-height:1.5em"></p></div>
  ${takeaways(['Un modèle est une fonction à paramètres (ici w et b).','Une fonction de coût (la MSE) mesure à quel point il se trompe.','Entraîner = minimiser le coût. La descente de gradient y arrive par petits pas.','Un taux trop grand fait diverger, un taux trop petit rend l\'apprentissage lent.'])}`;
  const sw=$('#lw',el),sb=$('#lb',el);
  function hist_(){const h=$('#lh',el);if(hist.length<2){h.innerHTML=`<text class="tx" x="8" y="48">La courbe d'erreur apparaît ici pendant l'entraînement.</text>`;return}
    const L=hist.map(v=>Math.log10(v+1e-3)),lo=Math.min(...L),hi=Math.max(...L,lo+.1),sx=scale(0,Math.max(hist.length-1,30),10,630),sy=scale(lo,hi,80,10);
    h.innerHTML=`<line class="gl" x1="10" x2="630" y1="80" y2="80"/><polyline class="ln" points="${L.map((v,i)=>sx(i)+','+sy(v)).join(' ')}"/><text class="tx" x="10" y="9">MSE (échelle log)</text><text class="tx" x="630" y="76" text-anchor="end">pas : ${hist.length-1}</text>`}
  function upd(){
    $('#lsv',el).innerHTML=lineChart('clL',P,w,b,showOpt?O:null);
    sw.value=w;sb.value=b;$('#lwo',el).textContent=f2(w);$('#lbo',el).textContent=f1(b);
    $('#sM',el).textContent=isFinite(mse(P,w,b))?f2(mse(P,w,b)):'∞';$('#sW',el).textContent=f2(w);$('#sB',el).textContent=f2(b);hist_();

  function run(){

    timer=setInterval(()=>{

    if(a.dataset.a==='gd')run();
    if(a.dataset.a==='ols'){stop();w=O.w;b=O.b;showOpt=true;hist=[];$('#lmsg',el).textContent='Formule exacte des moindres carrés : w = '+f2(w)+', b = '+f2(b)+'.';upd()}
    if(a.dataset.a==='rst'){stop();w=0.2;b=7;hist=[];showOpt=false;$('#lmsg',el).textContent='';upd()}};
  upd();
}});

LESSONS.push({id:'knn',title:'KNN : classer par voisinage',sub:'Un point ressemble à ses voisins les plus proches',min:6,render(el){
  const r=rng(11),U=6.4;

  ${takeaways(['KNN classe un point d\'après le vote de ses k voisins les plus proches.','k est un hyperparamètre : on le choisit par validation croisée, pas à l\'œil.','Les variables doivent être mises à la même échelle.'])}`;

/* ---------- Leçon 4 : sous- et sur-apprentissage ---------- */
function polyFit(xs,ys,d){
  const m=d+1,A=Array.from({length:m},()=>Array(m+1).fill(0));
  xs.forEach((x,i)=>{const t=2*x-1,pw=[1];for(let j=1;j<2*m;j++)pw[j]=pw[j-1]*t;for(let a=0;a<m;a++){for(let c=0;c<m;c++)A[a][c]+=pw[a+c];A[a][m]+=pw[a]*ys[i]}});
  for(let a=0;a<m;a++)A[a][a]+=1e-8;
  for(let i=0;i<m;i++){let p=i;for(let q=i+1;q<m;q++)if(Math.abs(A[q][i])>Math.abs(A[p][i]))p=q;[A[i],A[p]]=[A[p],A[i]];for(let q=i+1;q<m;q++){const f=A[q][i]/A[i][i];for(let c=i;c<=m;c++)A[q][c]-=f*A[i][c]}}
  const co=Array(m).fill(0);for(let i=m-1;i>=0;i--){let s=A[i][m];for(let c=i+1;c<m;c++)s-=A[i][c]*co[c];co[i]=s/A[i][i]}
  return co;
}
const polyEval=(co,x)=>{const t=2*x-1;let s=0,p=1;for(const c of co){s+=c*p;p*=t}return s};

LESSONS.push({id:'overfit',title:'Sous- et sur-apprentissage',sub:'Pourquoi un modèle parfait sur l\'entraînement peut échouer en vrai',min:7,render(el){
  const truth=x=>Math.sin(2*Math.PI*x),mk=(seed,n,reg)=>{const r=rng(seed);return Array.from({length:n},(_,i)=>{const x=reg?(i+.5)/n:r();return{x,y:truth(x)+gauss(r)*0.28}})};
  const TR=mk(5,14,1),TE=mk(99,40,0);
  const err=(co,S)=>S.reduce((a,p)=>a+(p.y-polyEval(co,p.x))**2,0)/S.length;
  const E=[];for(let d=1;d<=11;d++){const co=polyFit(TR.map(p=>p.x),TR.map(p=>p.y),d);E.push({d,tr:err(co,TR),te:err(co,TE)})}
  const bestD=E.reduce((a,e)=>e.te<a.te?e:a).d;
  let d=1,showTest=true;
  el.innerHTML=`<p class="lead">On essaie d'apprendre une courbe à partir de 14 points bruités (bleus). Les points orange creux sont des données jamais vues. Monte le degré du polynôme : la courbe verte devient de plus en plus flexible.</p>

const GLV=[{seed:31,n:12,w:1.0,b:1.0,sd:.5,w0:0,b0:6,name:'Échauffement'},{seed:32,n:14,w:-.6,b:9,sd:.8,w0:0,b0:6,name:'Pente négative'},{seed:33,n:16,w:.5,b:3,sd:1.6,w0:-1,b0:9,name:'Données bruitées'},{seed:34,n:10,w:1.3,b:.5,sd:1.1,w0:0,b0:6,name:'Forte pente'}];

const ITEMS=[
 ['Prédire le prix d\'un appartement à partir de sa surface',0],['Estimer la température de demain',0],['Prévoir le nombre de ventes du mois prochain',0],

 ['Piloter un drone en maximisant une récompense cumulée',3],['Optimiser la stratégie d\'un bot de jeu vidéo',3]];

function lineGame(el,lv){
  const L=GLV[lv],P=genLine(L.seed,L.n,L.w,L.b,L.sd),O=ols(P),best=mse(P,O.w,O.b);
  let w=L.w0,b=L.b0,done=false;
  el.innerHTML=`<div class="sec"><button class="btn sm" data-back style="align-self:flex-start">← Jeux</button>
  ${head('Jeu 1 · niveau '+(lv+1)+' sur '+GLV.length+' · '+L.name,'Ajuste la droite','Règle la pente et le décalage pour que la droite passe au plus près des points. Les traits rouges sont tes erreurs.')}
  <div class="chips">${GLV.map((g,i)=>`<button class="chip" data-lv="${i}" aria-pressed="${i===lv}">Niv. ${i+1} ${stars(S.game.line[i]||0)}</button>`).join('')}</div>
  <div class="viz"><svg id="gsv" viewBox="0 0 ${LC.W} ${LC.H}" role="img" aria-label="Points et droite à ajuster"></svg></div>
  <div class="card sec">${slider('gw','pente w',-2,3,0.05,w)}${slider('gb','décalage b',-2,10,0.1,b)}
  <div class="row" style="justify-content:space-between"><b>Qualité de l'ajustement</b><b id="gq" class="mono">0 %</b></div><div class="bar"><i id="gbar" style="width:0"></i></div>
  <div class="row"><button class="btn pri" id="gval">Valider</button></div><p id="gmsg" class="mut" style="min-height:1.6em"></p></div></div>`;
  const quality=()=>Math.min(100,best/Math.max(mse(P,w,b),1e-9)*100);
  function upd(){
    $('#gsv').innerHTML=lineChart('clG',P,w,b,done?O:null);
    $('#gwo').textContent=f2(w);$('#gbo').textContent=f1(b);
    const q=Math.round(quality());$('#gq').textContent=q+' %';$('#gbar').style.width=q+'%';
  }
  el.oninput=e=>{if(done)return;if(e.target.id==='gw')w=+e.target.value;else if(e.target.id==='gb')b=+e.target.value;else return;upd()};
  el.onclick=e=>{
    if(e.target.closest('[data-back]')){VIEWS.jeu(el);return}
    const c=e.target.closest('[data-lv]');if(c){lineGame(el,+c.dataset.lv);return}
    if(e.target.id!=='gval')return;
    if(done){lineGame(el,lv<GLV.length-1?lv+1:0);return}
    done=true;const q=quality(),st=q>=90?3:q>=65?2:q>=33?1:0,old=S.game.line[lv]||0,gain=Math.max(0,st-old)*10;
    if(st>old){S.game.line[lv]=st;save()}
    $('#gmsg').textContent=stars(st)+'  Ta droite : w = '+f2(w)+', b = '+f2(b)+'. La meilleure (pointillés) : w = '+f2(O.w)+', b = '+f2(O.b)+'.';
    $('#gval').textContent=lv<GLV.length-1?'Niveau suivant':'Recommencer';
    upd();if(gain)addXP(gain,'niveau '+(lv+1));
  };
  upd();
}

function blitz(el){

  const next=()=>{if(i>=Q.length){Q.length=0;shuffle(ITEMS.slice()).forEach(x=>Q.push(x));i=0}return Q[i++]};
  let cur;
  el.innerHTML=`<div class="sec"><button class="btn sm" data-back style="align-self:flex-start">← Jeux</button>
  ${head('Jeu 2 · 60 secondes','Éclair ML','Quel type de problème est-ce ? Trois bonnes réponses d\'affilée augmentent ton multiplicateur.')}

VIEWS.cartes=function(el){
  const cats=['Toutes',...new Set(CARDS.map(c=>c[0]))];
  let cat='Toutes',cur=null;
  const bx=i=>S.cards[i]||1;
  const pool=()=>CARDS.map((c,i)=>i).filter(i=>cat==='Toutes'||CARDS[i][0]===cat);
  function pick(){
    const p=pool().filter(i=>bx(i)<3);if(!p.length)return null;

    const wts=c.map(i=>bx(i)===1?3:1),tot=wts.reduce((a,b)=>a+b,0);let r=Math.random()*tot;

    if(t.closest('#cr')){pool().forEach(i=>delete S.cards[i]);save();cur=pick();return card()}
    if(t.closest('#na')){const i=$('#ni'),v=i.value.trim();if(v){S.notes.unshift(v);save();i.value='';notes()}return}
    const d=t.closest('[data-del]');if(d){S.notes.splice(+d.dataset.del,1);save();notes()}

};

VIEWS.qcm=function(el){
  const N=10;
  function start(){
    const done=Object.keys(S.quiz.done).length;
    el.innerHTML=`<div class="sec">${head('Évaluation','QCM éclair','10 questions tirées au hasard parmi '+QUIZ.length+'. Chaque question réussie pour la première fois rapporte 5 XP.')}
    <div class="stats">${stat('Meilleur score',S.quiz.best+' / '+N)}${stat('Questions maîtrisées',done+' / '+QUIZ.length)}</div>
    <div><button class="btn pri" id="qs">Commencer</button></div></div>`;
    el.oninput=null;el.onclick=e=>{if(e.target.id==='qs')run()};
  }
  function run(){
    const order=shuffle(QUIZ.map((_,i)=>i)).slice(0,N),res=[];let k=0,locked=false;
    function ask(){
      const qi=order[k],Q=QUIZ[qi];locked=false;
      el.innerHTML=`<div class="sec"><div class="row" style="justify-content:space-between"><span class="kicker">Question ${k+1} sur ${N}</span><span class="mono mut">${res.filter(Boolean).length} juste${res.filter(Boolean).length>1?'s':''}</span></div>
      <div class="bar"><i style="width:${k/N*100}%"></i></div><h2 style="font-size:22px;margin:6px 0">${Q[0]}</h2>
      <div class="opts">${Q[1].map((o,i)=>`<button class="opt" data-o="${i}">${esc(o)}</button>`).join('')}</div><div id="qf" class="sec"></div></div>`;
    }
    el.onclick=e=>{
      const o=e.target.closest('[data-o]');
      if(o&&!locked){locked=true;const qi=order[k],Q=QUIZ[qi],ok=+o.dataset.o===Q[2];res.push(ok);
        $$('.opt').forEach((b,i)=>{b.disabled=true;if(i===Q[2])b.classList.add('good')});if(!ok)o.classList.add('bad');
        if(ok&&!S.quiz.done[qi]){S.quiz.done[qi]=true;save();addXP(5,'bonne réponse')}
        $('#qf').innerHTML=`<div class="note ${ok?'tip':'bad'}"><b>${ok?'Bonne réponse.':'Pas tout à fait.'}</b> ${Q[3]}</div><div><button class="btn pri" id="qn">${k<N-1?'Question suivante':'Voir le résultat'}</button></div>`;return}
      if(e.target.id==='qn'){k++;if(k<N)ask();else finish()}

      el.innerHTML=`<div class="sec">${head('Résultat','Tu as '+sc+' sur '+N,sc===N?'Sans faute.':sc>=7?'Solide. Les erreurs ci-dessous sont à relire.':'Continue : relis les explications puis retente.')}
      <div class="card row" style="gap:20px"><svg viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Score ${sc} sur ${N}"><circle cx="60" cy="60" r="52" fill="none" stroke="var(--surface-2)" stroke-width="12"/><circle cx="60" cy="60" r="52" fill="none" stroke="var(--accent)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C*sc/N} ${C}" transform="rotate(-90 60 60)"/><text x="60" y="68" text-anchor="middle" style="font:800 26px var(--display);fill:var(--ink)">${Math.round(sc/N*100)}%</text></svg>

      ${missed.length?'<h3>À revoir</h3>'+missed.map(([qi])=>`<div class="card sec" style="gap:6px"><b>${QUIZ[qi][0]}</b><span>Réponse : ${esc(QUIZ[qi][1][QUIZ[qi][2]])}</span><span class="mut">${QUIZ[qi][3]}</span></div>`).join(''):''}</div>`;
    }

  }

};

 tb:tbl(['city','city_Paris','city_Rabat','city_Lyon'],[['Paris','1','0','0'],['Rabat','0','1','0'],['Lyon','0','0','1']]),
 code:`# One-hot : catégories sans ordre (ville, couleur)
encoder = OneHotEncoder(handle_unknown='ignore', sparse_output=False)

# Ordinal : catégories ordonnées (petit < moyen < grand)

{tag:'Transformation',t:'Mettre à l\'échelle',why:'Indispensable pour KNN, SVM, régression logistique et réseaux de neurones. Inutile pour les arbres et les forêts. fit sur le train seulement.',

 code:`scaler = StandardScaler()                    # moyenne 0, écart-type 1

# Alternative : valeurs entre 0 et 1

X_train_mm = MinMaxScaler().fit_transform(X_train)`},
{tag:'Découpage',t:'Séparer X, y puis train / test',why:'Le découpage vient avant toute transformation qui apprend quelque chose. stratify conserve les proportions de classes.',code:`X = df.drop(columns=['target'])
y = df['target']

X_train, X_test, y_train, y_test = train_test_split(
    X, y,
    test_size=0.2,       # 20 % pour le test
    random_state=42,     # résultats reproductibles
    stratify=y,          # même proportion de classes (classification)
)`},
{tag:'Pipeline',t:'ColumnTransformer + Pipeline (le modèle à retenir)',why:'La pièce maîtresse : tout le prétraitement et le modèle dans un seul objet. Zéro fuite de données, un seul fit, un seul predict.',viz:PIPEVIZ,code:`num_cols = X.select_dtypes(include='number').columns
cat_cols = X.select_dtypes(exclude='number').columns

num_pipe = Pipeline([
    ('imputer', SimpleImputer(strategy='median')),
    ('scaler', StandardScaler()),
])
cat_pipe = Pipeline([
    ('imputer', SimpleImputer(strategy='most_frequent')),
    ('onehot', OneHotEncoder(handle_unknown='ignore')),
])

preprocess = ColumnTransformer([
    ('num', num_pipe, num_cols),
    ('cat', cat_pipe, cat_cols),
])

pipe = Pipeline([
    ('prep', preprocess),
    ('model', RandomForestClassifier(random_state=42)),
])

pipe.fit(X_train, y_train)       # prétraitement + entraînement
y_pred = pipe.predict(X_test)`},
{tag:'Modèles',t:'Comparer plusieurs modèles avec une baseline',why:'Commence toujours par un modèle de base : si ton modèle ne le bat pas, il n\'apprend rien d\'utile.',code:`from sklearn.dummy import DummyClassifier

for name, m in models.items():

{tag:'Évaluation',t:'Évaluer une classification',why:'Ne te contente jamais de l\'accuracy : le rapport donne précision, rappel et F1 pour chaque classe.',code:`y_pred = model.predict(X_test)

from sklearn.metrics import ConfusionMatrixDisplay

plt.show()`},
{tag:'Évaluation',t:'Évaluer une régression',why:'MAE : erreur moyenne dans l\'unité de la cible. RMSE : punit les grosses erreurs. R² : part de variance expliquée.',code:`from sklearn.metrics import mean_absolute_error, mean_squared_error, r2_score

{tag:'Réglage',t:'Validation croisée et GridSearchCV',why:'Dans un Pipeline, les hyperparamètres d\'une étape s\'écrivent nom_étape + deux underscores + paramètre.',code:`scores = cross_val_score(pipe, X_train, y_train, cv=5, scoring='f1')

print(search.best_params_, search.best_score_)
best = search.best_estimator_          # le pipeline complet, déjà entraîné`},
{tag:'Évaluation',t:'Importance des variables',why:'Pour comprendre ce que le modèle utilise. Fonctionne avec les arbres et les forêts.',code:`importances = pd.Series(model.feature_importances_, index=X.columns).sort_values()
importances.plot(kind='barh', figsize=(6, 5))
plt.show()`},
{tag:'Déploiement',t:'Sauvegarder et recharger un modèle',why:'Sauvegarde le pipeline entier, pas seulement le modèle, pour retrouver exactement le même prétraitement.',code:`import joblib

 ['pipe = ___([(\'prep\', preprocess), (\'model\', RandomForestClassifier())])',['Pipeline','GridSearchCV','LabelEncoder'],0,'<code class="i">Pipeline</code> enchaîne des étapes : prétraitement puis modèle.'],

VIEWS.code=function(el){
  let sub='lib',tag='Tous',q='';
  const tags=['Tous',...new Set(SNIPS.map(s=>s.tag))];
  el.innerHTML=`<div class="sec">${head('Mémoire musculaire','Le code qui revient toujours','Prétraitement, découpage, pipeline, évaluation : ces blocs reviennent dans chaque projet. Lis-les, copie-les, puis entraîne-toi à les compléter de mémoire.')}
  <div class="chips" id="cs"><button class="chip" data-s="lib" aria-pressed="true">Bibliothèque</button><button class="chip" data-s="drill" aria-pressed="false">Complète le code</button><button class="chip" data-s="tools" aria-pressed="false">Quel outil ?</button></div>
  <div id="cv" class="sec"></div></div>`;
  function lib(){
    const list=SNIPS.filter(s=>(tag==='Tous'||s.tag===tag)&&(!q||(s.t+s.code).toLowerCase().includes(q)));
    $('#cv').innerHTML=`<div class="chips" id="ct">${tags.map(t=>`<button class="chip" data-t="${t}" aria-pressed="${t===tag}">${t}</button>`).join('')}</div>
    <input type="text" id="cq" placeholder="Chercher : imputer, split, scaler…" aria-label="Chercher un bloc de code" value="${esc(q)}">
    <div class="sec" id="cl">${list.length?list.map((s,i)=>`<details class="snip"${i===0?' open':''}><summary>${s.t}<span class="tag">${s.tag}</span></summary><div class="body"><p class="mut">${s.why}</p>${s.viz||''}${s.tb||''}${codeBlock(s.code,'python')}</div></details>`).join(''):'<p class="mut">Aucun bloc ne correspond.</p>'}</div>`;
  }
  let di=0,order=[],ok=0,lock=false;
  const dcode=(c,fill)=>hl(c).replace(/___/g,fill?`<mark style="background:var(--good-soft);color:var(--ink);border-radius:4px;padding:0 6px">${esc(fill)}</mark>`:`<mark style="background:var(--warn-soft);color:var(--ink);border-radius:4px;padding:0 8px">  ?  </mark>`);
  function drill(){
    if(di===0&&!order.length){order=shuffle(DRILL.map((_,i)=>i));ok=0}
    if(di>=order.length){
      $('#cv').innerHTML=`<div class="card sec"><h3>Série terminée</h3><div class="big">${ok}<span class="mut" style="font-size:24px"> / ${order.length}</span></div><p class="mut">Refais la série jusqu'à ce que chaque réponse vienne sans réfléchir.</p><div><button class="btn pri" data-again>Recommencer</button></div></div>`;return}
    const d=DRILL[order[di]];lock=false;
    const opts=shuffle(d[1].map((t,i)=>({t,ok:i===d[2]})));
    $('#cv').innerHTML=`<div class="row" style="justify-content:space-between"><span class="kicker">Exercice ${di+1} sur ${order.length}</span><span class="mono mut">${ok} juste${ok>1?'s':''}</span></div><div class="bar"><i style="width:${di/order.length*100}%"></i></div>
    <div class="code"><pre><code id="dc">${dcode(d[0])}</code></pre></div><p class="mut">Quel élément complète le code ?</p>
    <div class="opts">${opts.map(o=>`<button class="opt mono" data-ok="${o.ok?1:0}" data-v="${esc(o.t)}">${esc(o.t)}</button>`).join('')}</div><div id="df" class="sec"></div>`;
    $('#cv').dataset.i=order[di];
  }
  el.onclick=e=>{
    const t=e.target;
    const s=t.closest('[data-s]');
    if(s){sub=s.dataset.s;$$('#cs .chip').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.s===sub)));if(sub==='lib')lib();else if(sub==='drill'){di=0;order=[];drill()}else $('#cv').innerHTML=`<p class="mut">Repère ton problème, trouve l'outil scikit-learn correspondant.</p>${tbl(['Problème','Outil'],TOOLS)}<div class="note tip"><b>Les 5 réflexes.</b> Découper avant de transformer. fit sur le train uniquement. Un random_state partout. Un Pipeline pour tout enchaîner. Une baseline avant tout modèle.</div>`;return}
    const tg=t.closest('[data-t]');if(tg){tag=tg.dataset.t;lib();return}
    const o=t.closest('[data-v]');
    if(o&&!lock){lock=true;const good=o.dataset.ok==='1',i=+$('#cv').dataset.i,d=DRILL[i];
      $$('.opt',el).forEach(b=>{b.disabled=true;if(b.dataset.ok==='1')b.classList.add('good')});if(!good)o.classList.add('bad');
      const right=d[1][d[2]];$('#dc').innerHTML=dcode(d[0],right);
      if(good){ok++;if(!S.drill[i]){S.drill[i]=true;save();addXP(3,'code complété')}}
      $('#df').innerHTML=`<div class="note ${good?'tip':'bad'}"><b>${good?'Exact.':'Réponse : '+esc(right)+'.'}</b> ${d[3]}</div><div><button class="btn pri" data-next>${di<order.length-1?'Exercice suivant':'Voir le score'}</button></div>`;return}
    if(t.closest('[data-next]')){di++;drill();return}
    if(t.closest('[data-again]')){di=0;order=[];drill()}
  };
  el.oninput=e=>{if(e.target.id==='cq'){q=e.target.value.trim().toLowerCase();const pos=e.target.selectionStart;lib();const n=$('#cq');n.focus();n.setSelectionRange(pos,pos)}};
  lib();
};
