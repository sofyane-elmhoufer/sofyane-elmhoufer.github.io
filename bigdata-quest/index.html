<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Big Data Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#14123a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BD Quest">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
*{box-sizing:border-box}
html{padding-top:0;padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}

/* Concept : une carte de pipeline à parcourir, des autocollants épais (contours encre + ombre dure) sur un fond nuit.
   Un seul univers visuel, volontairement : jeu sombre, couleurs vives par monde. */
:root{
  --ink:#14123a; --ink2:#201d57; --ink3:#33308a; --paper:#fff6e5; --paper2:#ffe8bd; --line:#0b0a26;
  --coral:#ff6b57; --sun:#ffc93c; --mint:#35d49a; --sky:#41b8ff; --grape:#a98bff; --pink:#ff7ac6;
  --txt:#fff6e5; --mut:#b9b5f0; --good:#35d49a; --bad:#ff6b57;
  --f-disp:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --f-body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
body{
  background-color:var(--ink);
  background-image:radial-gradient(rgba(255,246,229,.07) 1.5px,transparent 1.7px);
  background-size:30px 30px;
  color:var(--txt);font-family:var(--f-body);font-size:16px;line-height:1.5;min-height:100vh;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:0;padding-bottom:40px;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--ink)}
button{font-family:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-disp);line-height:1.1;margin:0;text-wrap:balance}
p{margin:0 0 .7em}
.app{max-width:940px;margin:0 auto;min-width:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px}

/* ---------- boutons ---------- */
.btn{--c:var(--paper);display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;
  background:var(--c);color:var(--line);font-weight:700;font-size:16px;border:3px solid var(--line);border-radius:14px;
  padding:10px 18px;box-shadow:0 4px 0 var(--line);transition:transform .08s,box-shadow .08s,filter .15s;min-height:44px}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:grayscale(.4)}
.btn.sun{--c:var(--sun)} .btn.mint{--c:var(--mint)} .btn.coral{--c:var(--coral)} .btn.sky{--c:var(--sky)} .btn.grape{--c:var(--grape)}
.btn.big{font-size:19px;padding:13px 26px;font-family:var(--f-disp);font-weight:800}
.btn.small{font-size:14px;padding:6px 12px;min-height:36px;border-radius:11px}
.btn.ghost{--c:transparent;color:var(--txt);border-color:var(--mut);box-shadow:none}

/* ---------- HUD ---------- */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--ink);padding:12px 0 10px;
  display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;border-bottom:3px solid var(--ink3)}
.hud .ttl{flex:1 1 140px;min-width:0}
.hud .ttl small{display:block;color:var(--mut);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.hud .ttl b{font-family:var(--f-disp);font-size:20px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hearts{display:flex;gap:4px}
.heart{width:26px;height:24px;transition:transform .2s}
.heart.lost{filter:grayscale(1) brightness(.5);transform:scale(.85)}
.heart.hit{animation:shake .4s}
.xp{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-weight:700;font-size:14px;background:var(--ink2);border:3px solid var(--ink3);border-radius:999px;padding:3px 12px}
.xp .star{width:16px;height:16px}
.xp.bump{animation:pop .4s}
.streak{font-family:var(--f-mono);font-size:13px;font-weight:700;color:var(--sun);min-width:46px;opacity:0;transition:opacity .2s}
.streak.on{opacity:1}
.track{display:flex;gap:6px;width:100%;order:9}
.track i{flex:1;height:9px;border-radius:9px;background:var(--ink3);transition:background .3s}
.track i.done{background:var(--mint)} .track i.now{background:var(--sun);animation:pulse 1.4s infinite}

/* ---------- scène ---------- */
.scene{padding-top:18px;display:grid;gap:18px}
.title-row{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline}
.title-row h2{font-size:clamp(24px,4.4vw,34px)}
.title-row .tag{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--line);background:var(--c,var(--sun));border:3px solid var(--line);border-radius:8px;padding:1px 8px}
.stage{background:var(--ink2);border:3px solid var(--line);border-radius:22px;box-shadow:0 6px 0 var(--line);padding:10px;overflow:hidden}
.stage svg.art{display:block;width:100%;height:auto;max-height:340px}
.card{background:var(--paper);color:var(--line);border:3px solid var(--line);border-radius:20px;box-shadow:0 6px 0 var(--line);padding:18px 20px}
.card h3{font-size:22px;margin-bottom:8px}
.card ul{margin:.3em 0 .6em;padding-left:1.15em}
.card li{margin:.25em 0}
.card code,.tip code,.opt code,.panel code,.bubble code,.verdict code{font-family:var(--f-mono);font-size:.88em;background:var(--paper2);color:var(--line);padding:1px 6px;border-radius:6px;border:2px solid rgba(11,10,38,.18)}
.card mark{background:var(--sun);padding:0 4px;border-radius:5px;color:var(--line)}
.lead{font-size:18px}
.coach{display:flex;gap:12px;align-items:flex-end}
.coach .octet{flex:none;overflow:visible}
.bubble{position:relative;background:var(--paper);color:var(--line);border:3px solid var(--line);border-radius:18px;padding:10px 16px;font-weight:500;box-shadow:0 4px 0 var(--line);min-width:0}
.bubble::before{content:"";position:absolute;left:-11px;bottom:18px;width:16px;height:16px;background:var(--paper);border-left:3px solid var(--line);border-bottom:3px solid var(--line);transform:rotate(45deg)}
.bubble b{font-weight:700}
.nav{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.dots{display:flex;gap:7px}
.dots i{width:11px;height:11px;border-radius:50%;background:var(--ink3);border:2px solid var(--line)}
.dots i.on{background:var(--sun)}

/* ---------- questions ---------- */
.q{font-family:var(--f-disp);font-weight:800;font-size:clamp(20px,3.6vw,28px);line-height:1.2}
.opts{display:grid;gap:12px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;cursor:pointer;background:var(--paper);color:var(--line);
  border:3px solid var(--line);border-radius:16px;padding:12px 16px;box-shadow:0 4px 0 var(--line);font-size:16px;font-weight:500;transition:transform .08s,background .15s}
.opt:hover{background:var(--paper2)}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt .k{flex:none;width:30px;height:30px;border-radius:9px;border:3px solid var(--line);display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;background:var(--sky)}
.opt.right{background:var(--mint)} .opt.wrong{background:var(--coral);animation:shake .4s}
.opt.off{opacity:.55;pointer-events:none}
pre.code{margin:0;background:var(--line);color:var(--paper);font-family:var(--f-mono);font-size:14px;padding:12px 14px;border-radius:14px;overflow-x:auto;border:3px solid var(--ink3)}
.verdict{border:3px solid var(--line);border-radius:18px;padding:14px 18px;color:var(--line);box-shadow:0 5px 0 var(--line);animation:rise .3s both;display:grid;gap:10px}
.verdict.ok{background:var(--mint)} .verdict.ko{background:var(--coral)}
.verdict h4{font-family:var(--f-disp);font-size:22px;margin:0}
.verdict p{margin:0}
.verdict .row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.tip{background:var(--ink2);border:3px dashed var(--ink3);border-radius:16px;padding:10px 14px;color:var(--mut);font-size:15px}
.tip b{color:var(--txt)}

/* ---------- tri de cartes ---------- */
.sortarea{display:grid;gap:16px}
.deck{display:grid;place-items:center;min-height:120px}
.flip{background:var(--paper);color:var(--line);border:3px solid var(--line);border-radius:18px;box-shadow:0 6px 0 var(--line);padding:18px 22px;font-weight:700;font-size:19px;text-align:center;max-width:520px;width:100%;animation:deal .35s both}
.flip small{display:block;font-weight:500;font-size:14px;opacity:.7;margin-top:4px}
.flip.fly{animation:fly .45s forwards}
.flip.shake{animation:shake .4s}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.bin{cursor:pointer;background:var(--ink2);border:3px dashed var(--c);border-radius:18px;padding:12px;min-height:130px;color:var(--txt);text-align:left;transition:transform .1s,background .15s}
.bin:hover{background:var(--ink3);transform:translateY(-2px)}
.bin b{font-family:var(--f-disp);font-size:18px;color:var(--c);display:block}
.bin small{display:block;color:var(--mut);font-size:13px;margin-bottom:6px}
.bin .got{display:flex;flex-wrap:wrap;gap:5px}
.bin .got span{font-size:12px;background:var(--c);color:var(--line);border:2px solid var(--line);border-radius:8px;padding:1px 7px;font-weight:700;animation:pop .35s}
.bin .kbd{float:right;font-family:var(--f-mono);font-size:12px;border:2px solid var(--mut);border-radius:6px;padding:0 6px;color:var(--mut)}

/* ---------- ordre ---------- */
.slots{display:grid;gap:10px}
.slot{display:flex;align-items:center;gap:12px;min-height:54px;border:3px dashed var(--ink3);border-radius:16px;padding:6px 12px;color:var(--mut);background:rgba(32,29,87,.5)}
.slot .n{flex:none;width:32px;height:32px;border-radius:50%;background:var(--ink3);display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;color:var(--txt)}
.slot.filled{border-style:solid;border-color:var(--line);background:var(--c,var(--mint));color:var(--line);font-weight:700;animation:pop .35s}
.slot.filled .n{background:var(--line);color:var(--paper)}
.pool{display:flex;flex-wrap:wrap;gap:10px}
.chip{cursor:pointer;background:var(--paper);color:var(--line);border:3px solid var(--line);border-radius:14px;box-shadow:0 4px 0 var(--line);padding:9px 16px;font-weight:700;font-size:16px}
.chip:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.chip.shake{animation:shake .4s;background:var(--coral)}
.chip[disabled]{visibility:hidden}

/* ---------- association ---------- */
.mcols{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px}
.mcols .col{display:grid;gap:10px;align-content:start}
.mbtn{cursor:pointer;text-align:left;background:var(--paper);color:var(--line);border:3px solid var(--line);border-radius:14px;box-shadow:0 4px 0 var(--line);padding:10px 12px;font-weight:500;font-size:15px;min-height:52px;display:flex;align-items:center;transition:transform .08s}
.mbtn.sel{background:var(--sun);transform:translateY(-3px)}
.mbtn.ok{background:var(--c,var(--mint));pointer-events:none;box-shadow:none;transform:translateY(3px)}
.mbtn.no{animation:shake .4s;background:var(--coral)}
@media(max-width:560px){.mcols{gap:10px}.mbtn{font-size:14px;padding:8px 9px}}

/* ---------- exploration ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.tile{cursor:pointer;background:var(--ink2);border:3px solid var(--line);border-radius:18px;box-shadow:0 5px 0 var(--line);padding:6px 6px 10px;text-align:center;color:var(--txt);transition:transform .1s;position:relative}
.tile:hover{transform:translateY(-3px)}
.tile.cur{outline:3px solid var(--c);outline-offset:3px}
.tile svg{display:block;width:100%;height:auto;border-radius:12px;background:var(--ink)}
.tile b{display:block;font-family:var(--f-disp);font-size:17px;margin-top:6px;color:var(--c)}
.tile .seen{position:absolute;top:-8px;right:-8px;width:26px;height:26px;border-radius:50%;background:var(--mint);border:3px solid var(--line);display:none;place-items:center}
.tile.vu .seen{display:grid}
.tile .seen svg{width:16px;height:16px;background:none;border-radius:0}
.prog{font-family:var(--f-mono);font-size:13px;color:var(--mut)}
.detail{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:16px;align-items:center}
@media(max-width:640px){.detail{grid-template-columns:1fr}}

/* ---------- laboratoires ---------- */
.lab{display:grid;gap:14px}
.panel{background:var(--ink2);border:3px solid var(--line);border-radius:20px;box-shadow:0 5px 0 var(--line);padding:14px}
.meter{display:grid;gap:4px;margin:8px 0}
.meter .lab-l{display:flex;justify-content:space-between;font-size:14px;font-weight:700}
.bar{position:relative;height:18px;background:var(--ink);border:3px solid var(--line);border-radius:999px;overflow:hidden}
.bar>i{position:absolute;inset:0 auto 0 0;width:0;background:var(--c,var(--mint));transition:width .5s cubic-bezier(.3,1.4,.5,1)}
.bar>u{position:absolute;top:-2px;bottom:-2px;width:3px;background:var(--paper);text-decoration:none;opacity:.9}
.ctrls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
input[type=range]{width:100%;accent-color:var(--sun);height:30px}
input[type=text],input[type=password]{background:var(--paper);color:var(--line);border:3px solid var(--line);border-radius:12px;padding:8px 12px;font:600 16px var(--f-body);min-width:0;width:150px}
table.data{width:100%;border-collapse:separate;border-spacing:0;font-size:15px}
table.data th{font-family:var(--f-mono);font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);text-align:left;padding:6px 8px}
table.data td{background:var(--paper);color:var(--line);padding:7px 8px;border-top:2px solid var(--line);font-weight:500;transition:filter .4s}
table.data tr:first-child td{border-top:0}
table.data td:first-child{border-radius:10px 0 0 10px} table.data td:last-child{border-radius:0 10px 10px 0}
table.data td.mask{filter:blur(4px)}
.scroll-x{overflow-x:auto}
.chk{display:flex;gap:10px;align-items:center;font-weight:500;color:var(--mut)}
.chk i{flex:none;width:24px;height:24px;border-radius:8px;border:3px solid var(--ink3);display:grid;place-items:center}
.chk.ok{color:var(--txt)} .chk.ok i{background:var(--mint);border-color:var(--line)}
.lane{display:flex;gap:6px;align-items:center;min-height:42px;overflow-x:auto;padding:4px 2px}
.lane .lb{flex:none;width:30px;font-family:var(--f-mono);font-size:12px;color:var(--mut)}
.cell{flex:none;min-width:46px;text-align:center;border:3px solid var(--line);border-radius:10px;background:var(--c,var(--paper));color:var(--line);font-family:var(--f-mono);font-weight:700;font-size:12px;padding:3px 6px;animation:pop .4s}
.cell small{display:block;font-weight:500;opacity:.7;font-size:10px}
.seq{display:grid;gap:4px;font-family:var(--f-mono);font-size:13px}
.seq .r{display:grid;grid-template-columns:1fr 2fr 1fr;align-items:center;gap:6px;animation:rise .3s both;min-height:28px}
.seq .r .a{text-align:center;border-bottom:3px solid var(--c,var(--sky));position:relative;padding-bottom:1px;color:var(--c,var(--sky));font-weight:700}
.seq .r.lost .a{border-bottom-style:dashed;color:var(--coral);--c:var(--coral)}
.seq .r.l2r .a::after,.seq .r.r2l .a::before{content:"";position:absolute;bottom:-8px;border:6px solid transparent}
.seq .r.l2r .a::after{right:-4px;border-left:9px solid var(--c,var(--sky))}
.seq .r.r2l .a::before{left:-4px;border-right:9px solid var(--c,var(--sky))}
.seq .hd{color:var(--mut);text-align:center;font-weight:700}
.note{font-size:14px;color:var(--mut)}
.grid-nodes{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.node{cursor:pointer;border:3px solid var(--line);background:var(--paper);color:var(--line);border-radius:16px;padding:8px;box-shadow:0 4px 0 var(--line);font-weight:700;text-align:center;transition:transform .15s,filter .3s}
.node.dead{filter:grayscale(1) brightness(.45);transform:scale(.94);box-shadow:none}
.node .sh{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin-top:6px;min-height:26px}
.sh span{width:26px;height:26px;border-radius:7px;border:3px solid var(--line);display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;font-weight:700;background:var(--c)}
.node .crown{color:var(--sun)}
.lost-tag{color:var(--bad);font-weight:700}

/* ---------- superpositions ---------- */
.overlay{position:fixed;inset:0;z-index:80;background:rgba(11,10,38,.82);display:grid;place-items:center;padding:20px;animation:fade .3s both;overflow:auto}
.overlay .card{max-width:520px;width:100%;text-align:center;display:grid;gap:12px;justify-items:center;animation:deal .4s both}
.stars{display:flex;gap:8px}
.stars svg{width:54px;height:54px}
.stars svg.on{animation:pop .5s both}
.bignum{font-family:var(--f-disp);font-weight:800;font-size:44px;line-height:1}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:90}

/* ---------- carte ---------- */
.hero{display:flex;flex-wrap:wrap;gap:18px 26px;align-items:center;padding:26px 0 8px}
.hero .txt{flex:1 1 300px;min-width:0}
.hero h1{font-size:clamp(38px,8vw,68px);font-weight:800;letter-spacing:-.02em}
.hero h1 em{font-style:normal;color:var(--sun)}
.hero p{color:var(--mut);font-size:18px;max-width:46ch}
.stat-row{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
.pill{background:var(--ink2);border:3px solid var(--ink3);border-radius:999px;padding:4px 14px;font-weight:700;font-size:14px}
.pill b{color:var(--sun);font-family:var(--f-mono)}
.mapwrap{max-width:520px;margin:10px auto 0}
.mapwrap svg{display:block;width:100%;height:auto;overflow:visible}
.mapnode{cursor:pointer}
.mapnode:focus-visible{outline:none}
.mapnode:focus-visible circle.main{stroke:var(--sun);stroke-width:8}
.mapnode .ring{transform-box:fill-box;transform-origin:center;animation:ring 1.8s ease-out infinite}
.mapnode.lock{cursor:not-allowed}
.maplabel{paint-order:stroke;stroke:var(--ink);stroke-width:7px;stroke-linejoin:round}
.flowline{stroke-dasharray:2 14;stroke-linecap:round;animation:dash 1.1s linear infinite}
.foot{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:24px}

/* ---------- animations ---------- */
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes pulse{50%{opacity:.55}}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes deal{from{transform:translateY(-24px) rotate(-4deg);opacity:0}to{transform:none;opacity:1}}
@keyframes fly{to{transform:translateY(90px) scale(.3);opacity:0}}
@keyframes dash{to{stroke-dashoffset:-16}}
@keyframes ring{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.5);opacity:0}}
@keyframes float{50%{transform:translateY(-6px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fall{0%{transform:translateY(-60px);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateY(60px);opacity:0}}
@keyframes grow{0%,100%{transform:scaleY(.55)}50%{transform:scaleY(1)}}
@keyframes growx{0%{transform:scaleX(.05)}70%,100%{transform:scaleX(1)}}
@keyframes blinkled{50%{opacity:.2}}
@keyframes appear{0%,10%{opacity:0;transform:scale(.4)}25%,85%{opacity:1;transform:scale(1)}100%{opacity:0}}
@keyframes flicker{0%,100%{opacity:1}20%{opacity:.35}40%{opacity:.9}60%{opacity:.2}80%{opacity:.8}}
@keyframes sweep{to{transform:rotate(360deg)}}
@keyframes glow{50%{filter:drop-shadow(0 0 10px rgba(255,201,60,.9))}}
@keyframes slidein{from{transform:translateX(-30px);opacity:0}to{transform:none;opacity:1}}
@keyframes cellin{0%{transform:scale(0)}100%{transform:scale(1)}}
@keyframes wobble{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes zz{0%{transform:translateY(0);opacity:0}30%{opacity:1}100%{transform:translateY(-18px);opacity:0}}
.octet{animation:float 3s ease-in-out infinite}
.octet .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
.octet .ant{transform-box:fill-box;transform-origin:center;animation:pulse 1.6s infinite}
.a-float{animation:float 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.a-spin{animation:spin 6s linear infinite;transform-box:fill-box;transform-origin:center}
.a-fall{animation:fall 2.6s linear infinite}
.a-grow{animation:grow 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.a-pulse{animation:pulse 1.5s infinite}
.a-led{animation:blinkled 1s infinite}
.a-glow{animation:glow 2s infinite}
.a-flicker{animation:flicker 1.2s infinite}
.a-sweep{animation:sweep 3s linear infinite;transform-box:fill-box;transform-origin:0% 100%}
.a-wob{animation:wobble 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.a-appear{animation:appear 4s infinite;transform-box:fill-box;transform-origin:center}
.a-bar{animation:growx 3s ease-out infinite;transform-box:fill-box;transform-origin:0 50%}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}
}

/* =====================================================================
   ONGLETS + COURS
   ===================================================================== */
.tabbar{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;gap:6px;padding:6px;margin:26px auto 0;max-width:380px;
  background:var(--ink2);border:3px solid var(--line);border-radius:24px;box-shadow:0 5px 0 var(--line),0 0 0 3px var(--ink3)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;background:transparent;border:0;border-radius:17px;padding:6px 8px;color:var(--mut);font-size:13px;min-height:54px;justify-content:center}

.shelves{display:grid;gap:30px;padding:8px 0 4px}

.shelf-h{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.shelf-ic{flex:none;width:46px;height:46px;background:var(--ink2);border:3px solid var(--line);border-radius:14px;display:grid;place-items:center;padding:5px}

.shelf-t{flex:1;min-width:0}

.shelf-t h2{font-size:clamp(20px,4vw,26px)}
.shelf-t .sub{color:var(--mut);font-size:14px}
.cnt{flex:none;font-family:var(--f-mono);font-weight:700;font-size:13px;background:var(--ink2);border:3px solid var(--ink3);border-radius:999px;padding:2px 11px;color:var(--mut)}
.cnt.full{background:var(--mint);color:var(--line);border-color:var(--line)}
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:14px 12px;align-items:end;padding:0 4px}
.book{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;cursor:pointer;
  background:var(--paper);color:var(--line);border:3px solid var(--line);border-left:14px solid var(--c);border-radius:6px 14px 14px 6px;
  padding:10px 10px 10px 10px;box-shadow:3px 5px 0 var(--line);min-height:150px;transform-origin:50% 100%;transition:transform .15s}
.book:nth-child(3n+2){min-height:164px}
.book:nth-child(3n){min-height:142px}
.book:hover{transform:translateY(-5px) rotate(-1.5deg)}

.book .bi{width:38px;height:38px;display:block}
.book .bi svg{width:100%;height:100%}

.book.read{background:#e3fbf1}
.book .bchk{position:absolute;right:-9px;top:-9px;width:28px;height:28px;border-radius:50%;background:var(--mint);border:3px solid var(--line);display:grid;place-items:center}
.plank{height:16px;margin:0 -6px;background:linear-gradient(#d9a066,#c18247);border:3px solid var(--line);border-radius:6px;box-shadow:0 6px 0 var(--line)}

/* leçon */
.lesson{padding-top:16px;display:grid;gap:16px}
.lcard{background:var(--paper);color:var(--line);border:3px solid var(--line);border-radius:22px;box-shadow:0 6px 0 var(--line);padding:16px 16px 10px;min-width:0}
.lcard.rise{animation:rise .3s both}
.lstep{display:inline-block;font-family:var(--f-mono);font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:var(--wc,var(--sun));border:3px solid var(--line);border-radius:8px;padding:1px 9px}
.lcard h2{font-size:clamp(23px,5vw,31px);margin:10px 0 12px}
.lbody{font-size:17px;line-height:1.6;min-width:0}
.lbody p{margin:0 0 .85em}
.lbody ul,.lbody ol{margin:.2em 0 .95em;padding-left:1.25em}
.lbody li{margin:.35em 0}
.lbody code{font-family:var(--f-mono);font-size:.86em;background:var(--paper2);padding:1px 6px;border-radius:6px;border:2px solid rgba(11,10,38,.22);word-break:break-word}
.lbody mark{background:var(--sun);padding:0 4px;border-radius:5px;color:var(--line)}
.lbody .tg{display:inline-block;background:var(--c,var(--sun));border:2px solid var(--line);border-radius:7px;padding:0 7px;font-weight:700;font-size:.92em;line-height:1.35}
.lbody pre.code{margin:0 0 14px;font-size:13.5px;line-height:1.5}
.lbody h3{font-size:19px;margin:.4em 0 .5em}
.fig{margin:6px 0 16px;background:var(--ink2);border:3px solid var(--line);border-radius:18px;padding:8px;box-shadow:0 4px 0 var(--line)}
.fig svg.art{display:block;width:100%;height:auto;max-width:640px;margin:0 auto}
.fig figcaption{color:var(--mut);font-size:13.5px;text-align:center;padding:6px 6px 2px;line-height:1.35}
.co{--bg:#fff;border:3px solid var(--line);border-radius:16px;background:var(--bg);padding:12px 14px 4px;margin:0 0 15px;position:relative}
.co>.lab{display:inline-block;font-family:var(--f-mono);font-weight:700;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;background:var(--line);color:var(--paper);border-radius:7px;padding:1px 9px;margin:0 0 7px}
.co.say{--bg:#d9f8eb} .co.ex{--bg:#dcf0ff} .co.key{--bg:#fff0b5} .co.prof{--bg:#ebe4ff} .co.warn{--bg:#ffdad4}
.co.say>.lab{background:#0f8f63} .co.ex>.lab{background:#1c74ad} .co.key>.lab{background:#8a6400} .co.prof>.lab{background:#5b43b8} .co.warn>.lab{background:#b3261e}
.co p:last-child,.co ul:last-child,.co ol:last-child{margin-bottom:.7em}
.tblw{overflow-x:auto;margin:0 0 15px;border:3px solid var(--line);border-radius:14px;background:#fff}
table.ct{border-collapse:collapse;width:100%;font-size:15px;min-width:440px}
table.ct th{background:var(--line);color:var(--paper);padding:8px 10px;text-align:left;font-family:var(--f-disp)}
table.ct td{padding:8px 10px;border-top:2px solid rgba(11,10,38,.14);vertical-align:top}
table.ct tr:nth-child(even) td{background:rgba(11,10,38,.04)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 15px}
.pair>div{border:3px solid var(--line);border-radius:14px;padding:10px 12px 4px;background:#fff}
.pair>div>b.h{display:block;font-family:var(--f-disp);font-size:17px;margin-bottom:5px}
@media (max-width:560px){.pair{grid-template-columns:1fr}}
.defs{display:grid;gap:10px;margin:0 0 15px}

.defs>div>i{flex:none;font-style:normal;font-family:var(--f-disp);font-weight:800;font-size:20px;width:36px;height:36px;border-radius:10px;border:3px solid var(--line);display:grid;place-items:center;background:var(--c,var(--sun))}
.defs>div>span{min-width:0;line-height:1.45}
.defs b{font-weight:700}
.lnav{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin:2px 0 6px}
.hud .track i[role=button]{cursor:pointer}
@media (max-width:420px){.lbody{font-size:16.5px}.lcard{padding:14px 13px 8px}}

</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
/* =====================================================================
   BIG DATA QUEST - moteur du jeu
   ===================================================================== */
const C={ink:'#14123a',ink2:'#201d57',ink3:'#33308a',paper:'#fff6e5',line:'#0b0a26',coral:'#ff6b57',sun:'#ffc93c',mint:'#35d49a',sky:'#41b8ff',grape:'#a98bff',pink:'#ff7ac6',mut:'#b9b5f0'};
const WCOL=[C.coral,C.sun,C.mint,C.sky,C.grape,C.pink,C.coral,C.sun,C.mint,C.sky,C.grape];
const app=document.getElementById('app');
const REDUCED=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

function h(tag,attrs,...kids){
  const e=document.createElement(tag);
  for(const k in (attrs||{})){
    const v=attrs[k]; if(v==null||v===false)continue;
    if(k==='class')e.className=v; else if(k==='html')e.innerHTML=v;
    else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v===true?'':v);
  }
  for(const c of kids.flat(3)){ if(c==null||c===false)continue; e.append(c&&c.nodeType?c:document.createTextNode(c)); }
  return e;
}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const keyOf=i=>String.fromCharCode(65+i);

/* ---------- sauvegarde (confort par visiteur) ---------- */
const LS_KEY='bdquest-enasf-v1';
let S={xp:0,done:{},sound:true,unlockAll:false};
try{const r=localStorage.getItem(LS_KEY);if(r)S=Object.assign(S,JSON.parse(r));}catch(e){}
function save(){try{localStorage.setItem(LS_KEY,JSON.stringify(S));}catch(e){}}

/* ---------- sons ---------- */
let AC=null;
function tone(f,t=.12,type='triangle',vol=.07,delay=0){
  if(!S.sound)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),g=AC.createGain(),t0=AC.currentTime+delay;
    o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+t);
    o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+t+.03);
  }catch(e){}
}
const sfx={
  ok(){tone(523,.1);tone(784,.16,'triangle',.07,.09)},
  bad(){tone(170,.25,'sawtooth',.045)},
  pop(){tone(680,.05,'triangle',.05)},
  win(){[523,659,784,1047].forEach((f,i)=>tone(f,.2,'triangle',.08,i*.1))},
  lose(){[330,262,196].forEach((f,i)=>tone(f,.28,'sawtooth',.045,i*.15))}
};

/* ---------- confettis ---------- */
function confetti(n=140){
  if(REDUCED)return;
  const cv=h('canvas',{id:'fx'});document.body.append(cv);
  const ctx=cv.getContext('2d');const W=cv.width=innerWidth,H=cv.height=innerHeight;
  const cols=[C.coral,C.sun,C.mint,C.sky,C.grape,C.pink];
  const ps=Array.from({length:n},()=>({x:W/2+(Math.random()-.5)*160,y:H*.4,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,r:Math.random()*6+4,c:cols[Math.floor(Math.random()*cols.length)],a:Math.random()*6,va:(Math.random()-.5)*.4}));
  let t=0;(function f(){t++;ctx.clearRect(0,0,W,H);
    ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.45;p.vx*=.99;p.a+=p.va;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.c;ctx.strokeStyle=C.line;ctx.lineWidth=2;ctx.fillRect(-p.r,-p.r/2,p.r*2,p.r);ctx.strokeRect(-p.r,-p.r/2,p.r*2,p.r);ctx.restore();});
    if(t<130)requestAnimationFrame(f);else cv.remove();})();
}

/* ---------- petites icônes SVG ---------- */
const heartSvg=()=>`<svg class="heart" viewBox="-2 -2 28 26" aria-hidden="true"><path d="M12 21 C-6 9 4 -3 12 5 C20 -3 30 9 12 21Z" fill="#ff6b57" stroke="#0b0a26" stroke-width="2.6" stroke-linejoin="round"/></svg>`;
const starSvg=(on=true,cls='')=>`<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true"><polygon points="12,2 15,9 22.5,9.5 16.8,14.4 18.6,21.8 12,17.8 5.4,21.8 7.2,14.4 1.5,9.5 9,9" fill="${on?C.sun:C.ink3}" stroke="${C.line}" stroke-width="2" stroke-linejoin="round"/></svg>`;
const checkSvg=`<svg width="16" height="16" viewBox="0 0 16 16"><path d="M3 8.5l3.2 3L13 4.5" fill="none" stroke="#0b0a26" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

/* ---------- mascotte : Octet (8 bits = 1 octet) ---------- */
function octet(mood='happy',size=84){
  const mouth={
    happy:`<path d="M31 62 Q42 73 53 62" fill="none" stroke="${C.line}" stroke-width="4" stroke-linecap="round"/>`,
    wow:`<ellipse cx="42" cy="64" rx="6" ry="7" fill="${C.line}"/>`,
    sad:`<path d="M31 69 Q42 58 53 69" fill="none" stroke="${C.line}" stroke-width="4" stroke-linecap="round"/>`,
    think:`<path d="M33 65 L51 63" fill="none" stroke="${C.line}" stroke-width="4" stroke-linecap="round"/>`
  }[mood]||'';
  const px=mood==='think'?3:0;
  let bits='';for(let i=0;i<8;i++)bits+=`<rect x="${16+i*6.6}" y="22" width="5" height="6" rx="1.5" fill="${i%3===1?C.line:C.paper}" opacity=".85"/>`;
  return `<svg class="octet" viewBox="0 0 84 96" width="${size}" height="${Math.round(size*96/84)}" aria-hidden="true">
  <line x1="42" y1="14" x2="42" y2="4" stroke="${C.line}" stroke-width="4" stroke-linecap="round"/>
  <circle class="ant" cx="42" cy="6" r="5" fill="${C.coral}" stroke="${C.line}" stroke-width="3"/>
  <rect x="22" y="76" width="14" height="14" rx="5" fill="${C.sun}" stroke="${C.line}" stroke-width="4"/>
  <rect x="48" y="76" width="14" height="14" rx="5" fill="${C.sun}" stroke="${C.line}" stroke-width="4"/>
  <rect x="8" y="14" width="68" height="66" rx="20" fill="${C.sky}" stroke="${C.line}" stroke-width="4"/>
  ${bits}
  <g class="eyes"><ellipse cx="29" cy="46" rx="9" ry="10" fill="${C.paper}" stroke="${C.line}" stroke-width="3"/><ellipse cx="55" cy="46" rx="9" ry="10" fill="${C.paper}" stroke="${C.line}" stroke-width="3"/>
  <circle cx="${30+px}" cy="${mood==='sad'?49:47}" r="4.4" fill="${C.line}"/><circle cx="${56+px}" cy="${mood==='sad'?49:47}" r="4.4" fill="${C.line}"/></g>
  ${mouth}</svg>`;
}
function coach(mood,html,size=76){
  return h('div',{class:'coach'},h('div',{html:octet(mood,size),style:'flex:none'}),h('div',{class:'bubble',html}));
}

/* ---------- rang ---------- */
const RANKS=[[0,'Octet débutant'],[120,'Data Scout'],[300,'Data Ranger'],[520,'Data Engineer'],[760,'Data Architect']];
const rankOf=xp=>RANKS.filter(r=>xp>=r[0]).pop()[1];

/* ---------- vues ---------- */
let run=null;
function levelUnlocked(i){return S.unlockAll||i===0||!!S.done[LEVELS[i-1].id];}
function firstOpen(){for(let i=0;i<LEVELS.length;i++)if(!S.done[LEVELS[i].id])return i;return LEVELS.length-1;}

function renderMap(){
  run=null;app.replaceChildren();window.scrollTo(0,0);
  const doneN=LEVELS.filter(l=>S.done[l.id]).length;
  const cur=firstOpen();
  const hero=h('header',{class:'hero'},
    h('div',{html:octet(doneN?'happy':'wow',120),style:'flex:none'}),
    h('div',{class:'txt'},
      h('h1',{html:'Big Data <em>Quest</em>'}),
      h('p',{},'Ton cours Big Data I & BD NoSQL, transformé en aventure. Traverse le pipeline, du premier octet jusqu\'à Kafka, et deviens Data Architect.'),
      h('div',{class:'stat-row'},
        h('span',{class:'pill',html:`XP <b>${S.xp}</b>`}),
        h('span',{class:'pill',html:`Rang <b>${rankOf(S.xp)}</b>`}),
        h('span',{class:'pill',html:`Niveaux <b>${doneN}/${LEVELS.length}</b>`})),
      h('button',{class:'btn sun big',onclick:()=>startLevel(cur)},doneN===LEVELS.length?'Rejouer le boss':(doneN?'Continuer l\'aventure':'Commencer l\'aventure'))));
  app.append(hero);

  const N=LEVELS.length,H=172,W=460,top=64;
  const X=i=>i%2===0?150:310, Y=i=>top+i*H, VH=top+(N-1)*H+150;
  let segs='',nodes='';
  for(let i=0;i<N-1;i++){
    const x0=X(i),y0=Y(i),x1=X(i+1),y1=Y(i+1);
    const d=`M${x0} ${y0} C${x0} ${y0+H*.62},${x1} ${y1-H*.62},${x1} ${y1}`;
    const open=!!S.done[LEVELS[i].id];
    segs+=`<path d="${d}" fill="none" stroke="${C.ink2}" stroke-width="26" stroke-linecap="round"/>
    <path d="${d}" fill="none" stroke="${C.line}" stroke-width="26" stroke-linecap="round" opacity=".5" transform="translate(0 4)"/>
    <path d="${d}" fill="none" stroke="${C.ink3}" stroke-width="20" stroke-linecap="round"/>
    <path class="${open?'flowline':''}" d="${d}" fill="none" stroke="${open?WCOL[i]:C.ink2}" stroke-width="6"${open?'':' stroke-dasharray="2 14" stroke-linecap="round"'}/>`;
  }
  LEVELS.forEach((L,i)=>{
    const x=X(i),y=Y(i),un=levelUnlocked(i),dn=S.done[L.id],isCur=un&&!dn&&i===cur,col=WCOL[i];
    const stars=dn?[0,1,2].map(k=>`<polygon transform="translate(${x-30+k*22} ${y+42}) scale(.7)" points="12,2 15,9 22.5,9.5 16.8,14.4 18.6,21.8 12,17.8 5.4,21.8 7.2,14.4 1.5,9.5 9,9" fill="${k<dn.stars?C.sun:C.ink3}" stroke="${C.line}" stroke-width="2.5" stroke-linejoin="round"/>`).join(''):'';
    const isBoss=i===N-1;
    const inner=un?`<text x="${x}" y="${y+11}" text-anchor="middle" font-family="Bricolage Grotesque, sans-serif" font-weight="800" font-size="${isBoss?26:30}" fill="${C.line}">${isBoss?'BOSS':i+1}</text>`
      :`<g transform="translate(${x-12} ${y-14})"><rect x="2" y="11" width="20" height="16" rx="4" fill="${C.paper}" stroke="${C.line}" stroke-width="3"/><path d="M6 11V7a6 6 0 0112 0v4" fill="none" stroke="${C.line}" stroke-width="3.5" stroke-linecap="round"/></g>`;
    nodes+=`<g class="mapnode ${un?'':'lock'}" data-i="${i}" tabindex="0" role="button" aria-label="Niveau ${i+1} : ${L.title}${un?'':' (verrouillé)'}">
      ${isCur?`<circle class="ring" cx="${x}" cy="${y}" r="40" fill="none" stroke="${col}" stroke-width="5"/>`:''}
      <circle cx="${x}" cy="${y+6}" r="40" fill="${C.line}"/>
      <circle class="main" cx="${x}" cy="${y}" r="40" fill="${un?(dn?col:C.paper):C.ink3}" stroke="${C.line}" stroke-width="5"/>
      ${un&&!dn?`<circle cx="${x}" cy="${y}" r="30" fill="${col}" stroke="${C.line}" stroke-width="3"/>`:''}
      ${inner}${stars}
      <text class="maplabel" x="${x}" y="${y+(dn?78:68)}" text-anchor="middle" font-family="Bricolage Grotesque, sans-serif" font-weight="800" font-size="17" fill="${un?C.paper:C.mut}">${L.title}</text>
      <text class="maplabel" x="${x}" y="${y+(dn?96:86)}" text-anchor="middle" font-family="DM Sans, sans-serif" font-weight="500" font-size="12.5" fill="${C.mut}">${L.sub}</text>
    </g>`;
  });
  const wrap=h('div',{class:'mapwrap',html:`<svg viewBox="0 0 ${W} ${VH}" role="group" aria-label="Carte des niveaux">${segs}${nodes}</svg>`});
  wrap.querySelectorAll('.mapnode').forEach(g=>{
    const go=()=>{const i=+g.dataset.i;if(levelUnlocked(i)){sfx.pop();startLevel(i);}else{sfx.bad();g.animate([{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'none'}],{duration:260});}};
    g.addEventListener('click',go);g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}});
  });
  app.append(wrap);
  const foot=h('div',{class:'foot'},
    h('button',{class:'btn ghost small',onclick:()=>{S.sound=!S.sound;save();renderMap();}},S.sound?'Son : activé':'Son : coupé'),

/* ---------- niveau ---------- */
let hudEl=null,sceneEl=null;
function startLevel(li){
  run={li,si:0,hearts:3,mistakes:0,xp:0,streak:0,gen:0,dead:false};
  buildShell();renderScene();
}
function buildShell(){
  const L=LEVELS[run.li],col=WCOL[run.li];
  app.replaceChildren();
  hudEl=h('div',{class:'hud'},
    h('button',{class:'btn small',onclick:()=>renderMap(),'aria-label':'Retour à la carte'},'← Carte'),
    h('div',{class:'ttl'},h('small',{},`Niveau ${run.li+1}`),h('b',{},L.title)),
    h('div',{class:'streak',id:'streak'}),
    h('div',{class:'hearts',id:'hearts','aria-label':'Vies'}),
    h('div',{class:'xp',id:'xp'}),
    h('div',{class:'track',id:'track'}));
  sceneEl=h('div',{});
  app.append(hudEl,sceneEl);
  document.documentElement.style.setProperty('--wc',col);
  updateHud();
}
function updateHud(bump){
  const hs=$('#hearts');if(hs){hs.innerHTML='';for(let i=0;i<3;i++)hs.append(h('span',{html:heartSvg(),class:'',style:'display:inline-flex'}));
    hs.querySelectorAll('.heart').forEach((el,i)=>{if(i>=run.hearts)el.classList.add('lost');});}
  const xp=$('#xp');if(xp){xp.innerHTML=`${starSvg(true,'star')}<span>${S.xp}</span>`;if(bump){xp.classList.remove('bump');void xp.offsetWidth;xp.classList.add('bump');}}
  const st=$('#streak');if(st){st.textContent=run.streak>=2?`x${run.streak}`:'';st.classList.toggle('on',run.streak>=2);}
}
const $=(s,r=document)=>r.querySelector(s);
function updateTrack(){
  const L=LEVELS[run.li],tr=$('#track');tr.replaceChildren();
  L.scenes.forEach((_,i)=>tr.append(h('i',{class:i<run.si?'done':i===run.si?'now':''})));
}
function renderScene(){
  const L=LEVELS[run.li],sc=L.scenes[run.si];
  run.gen++;updateTrack();
  const host=h('div',{class:'scene'});sceneEl.replaceChildren(host);
  window.scrollTo(0,0);
  const ctx=makeCtx(host,run.gen,sc);
  try{
    if(sc.type==='lab')LABS[sc.lab](sc,ctx);else SCENES[sc.type](sc,ctx);
  }catch(err){console.error(err);host.append(h('div',{class:'card'},'Oups, un bug dans cette étape. ',h('button',{class:'btn small',onclick:()=>nextScene()},'Passer')));}
  if(REDUCED)host.querySelectorAll('svg').forEach(s=>{try{s.pauseAnimations()}catch(e){}});
}
function nextScene(){
  run.si++;
  if(run.si>=LEVELS[run.li].scenes.length)finishLevel();else renderScene();
}
function makeCtx(host,gen,sc){
  const col=WCOL[run.li];
  const ctx={
    host,sc,col,
    alive:()=>!!run&&run.gen===gen&&!run.dead,
    title(text,tag){host.append(h('div',{class:'title-row'},h('h2',{},text),tag?h('span',{class:'tag',style:`--c:${col}`},tag):null));},
    gain(pts){run.xp+=pts;S.xp+=pts;save();updateHud(true);},
    correct(pts=10){
      run.streak++;const combo=run.streak>=3?5:0;
      ctx.gain(pts+combo);sfx.ok();updateHud(true);
    },
    wrong(){
      if(run.dead)return;
      run.hearts--;run.mistakes++;run.streak=0;sfx.bad();updateHud();
      const hs=document.querySelectorAll('#hearts .heart');const el=hs[run.hearts];if(el)el.classList.add('hit');
      if(run.hearts<=0){run.dead=true;setTimeout(gameOver,900);}
    },
    next(){nextScene();},
    verdict(ok,html,opts={}){
      const v=h('div',{class:'verdict '+(ok?'ok':'ko'),role:'status'},
        h('h4',{},ok?pick(['Bien joué !','Exact !','Parfait !','Dans le mille !']):pick(['Pas tout à fait…','Presque !','Aïe, retiens ça :'])),
        h('p',{html}),
        h('div',{class:'row'},h('span',{}),
          h('button',{class:'btn big',onclick:opts.onNext||ctx.next},opts.label||'Continuer →')));
      host.append(v);v.scrollIntoView({behavior:REDUCED?'auto':'smooth',block:'nearest'});
      const b=v.querySelector('button');if(b)b.focus({preventScroll:true});
      return v;
    }
  };
  return ctx;
}
const pick=a=>a[Math.floor(Math.random()*a.length)];

function gameOver(){
  if(!run)return;sfx.lose();
  const ov=h('div',{class:'overlay'},h('div',{class:'card'},
    h('div',{html:octet('sad',100)}),
    h('h3',{},'Plus de cœurs !'),
    h('p',{},'Pas de panique : même les clusters Kafka tombent en panne. Relis les explications, puis relance le niveau.'),
    h('div',{class:'ctrls',style:'justify-content:center'},
      h('button',{class:'btn sun big',onclick:()=>{ov.remove();startLevel(run.li);}},'Réessayer'),
      h('button',{class:'btn',onclick:()=>{ov.remove();renderMap();}},'Retour à la carte'))));
  document.body.append(ov);
}
function finishLevel(){
  const L=LEVELS[run.li];
  const stars=run.mistakes===0?3:run.mistakes<=2?2:1;
  const bonus=10*stars;S.xp+=bonus;
  const prev=S.done[L.id];S.done[L.id]={stars:Math.max(stars,prev?prev.stars:0)};save();
  updateHud(true);sfx.win();confetti();
  const last=run.li===LEVELS.length-1;
  const msg=last?'Tu as traversé tout le pipeline. Tu peux maintenant te présenter à l\'examen en toute confiance.'
    :(stars===3?'Sans faute ! Octet est bluffé.':stars===2?'Très bien. Encore un petit effort pour les 3 étoiles.':'Niveau validé. Rejoue-le pour décrocher plus d\'étoiles.');
  const li=run.li;
  const ov=h('div',{class:'overlay'},h('div',{class:'card'},
    h('div',{html:octet('wow',100)}),
    h('h3',{},last?'Tu es un Data Architect !':'Niveau terminé !'),
    h('div',{class:'stars'},[0,1,2].map(k=>h('span',{html:starSvg(k<stars,k<stars?'on':''),style:`display:inline-flex;animation-delay:${k*.2}s`}))),
    h('div',{class:'bignum'},`+${run.xp+bonus} XP`),
    h('p',{},msg),
    h('div',{class:'ctrls',style:'justify-content:center'},
      !last?h('button',{class:'btn sun big',onclick:()=>{ov.remove();startLevel(li+1);}},'Niveau suivant →'):null,
      h('button',{class:'btn',onclick:()=>{ov.remove();renderMap();}},'Retour à la carte'),
      h('button',{class:'btn ghost',onclick:()=>{ov.remove();startLevel(li);}},'Rejouer'))));
  document.body.append(ov);
  const f=ov.querySelector('.btn.sun');if(f)f.focus();
}

/* ---------- exploration : cartes à découvrir ---------- */
SCENES.explore=(sc,ctx)=>{
  ctx.title(sc.title,'Explorer');
  if(sc.say)ctx.host.append(coach(sc.mood||'think',sc.say));
  const seen=new Set();let cur=-1;
  const prog=h('div',{class:'prog'});
  const grid=h('div',{class:'tiles'});
  const detail=h('div',{});

    const el=h('button',{class:'tile',style:`--c:${t.color||WCOL[i%WCOL.length]}`,'aria-label':t.label,onclick:()=>open(i)},
      h('div',{html:t.art()}),h('b',{},t.label),h('span',{class:'seen',html:checkSvg}));
    grid.append(el);return el;
  });
  const cont=h('div',{});
  function upd(){prog.textContent=`Découvert : ${seen.size} / ${sc.tiles.length}`;}
  function open(i){
    sfx.pop();cur=i;const t=sc.tiles[i];
    tiles.forEach((el,k)=>el.classList.toggle('cur',k===i));
    if(!seen.has(i)){seen.add(i);tiles[i].classList.add('vu');ctx.gain(4);}

      h('div',{class:'stage',html:(t.big||t.art)()}),
      h('div',{class:'card',html:`<h3 style="color:${t.dark||C.line}">${t.label}</h3>${t.body}`})));
    if(REDUCED)detail.querySelectorAll('svg').forEach(s=>{try{s.pauseAnimations()}catch(e){}});
    upd();
    if(seen.size===sc.tiles.length&&!cont.hasChildNodes()){
      cont.append(h('div',{class:'verdict ok'},h('h4',{},'Tout est découvert !'),h('p',{},sc.done||'Tu as exploré toutes les cartes. En avant pour les défis.'),h('div',{class:'row'},h('span'),h('button',{class:'btn big',onclick:ctx.next},'Continuer →'))));
    }
  }
  ctx.host.append(prog,grid,detail,cont);upd();
  detail.append(h('div',{class:'tip',html:'<b>Touche une carte</b> pour la retourner et voir son schéma animé.'}));
};

/* ---------- quiz ---------- */
function buildQuiz(sc,ctx,opts={}){
  const wrap=h('div',{class:'scene',style:'padding:0'});
  const q=h('div',{class:'q'},sc.q);wrap.append(q);
  if(sc.code)wrap.append(h('pre',{class:'code'},sc.code));
  const order=shuffle(sc.opts.map((_,i)=>i));
  const list=h('div',{class:'opts',role:'group'});
  let locked=false;
  const btns=order.map((oi,pos)=>{
    const b=h('button',{class:'opt',onclick:()=>choose(oi,b)},h('span',{class:'k'},keyOf(pos)),h('span',{html:sc.opts[oi]}));
    list.append(b);return b;
  });
  wrap.append(list);
  function choose(oi,b){
    if(locked)return;locked=true;
    const ok=oi===sc.a;
    btns.forEach((x,p)=>{if(order[p]===sc.a)x.classList.add('right');else if(x===b)x.classList.add('wrong');else x.classList.add('off');});
    if(ok)ctx.correct(10);else ctx.wrong();
    if(opts.onAnswer)opts.onAnswer(ok);
    else if(ctx.alive()||ok)ctx.verdict(ok,sc.why||'');
  }
  wrap.lock=()=>{locked=true;};
  wrap.reveal=()=>{btns.forEach((x,p)=>{if(order[p]===sc.a)x.classList.add('right');else x.classList.add('off');});};
  return wrap;
}
SCENES.quiz=(sc,ctx)=>{
  ctx.title(sc.title||'Question éclair','Quiz');
  ctx.host.append(buildQuiz(sc,ctx));
  const onKey=e=>{if(!ctx.alive()){document.removeEventListener('keydown',onKey);return;}
    const k=e.key.toUpperCase().charCodeAt(0)-65;const bs=ctx.host.querySelectorAll('.opt');if(e.key.length===1&&k>=0&&k<bs.length)bs[k].click();};
  document.addEventListener('keydown',onKey);
};

/* ---------- tri de cartes ---------- */
SCENES.sort=(sc,ctx)=>{
  ctx.title(sc.title,'Tri');
  if(sc.say)ctx.host.append(coach('think',sc.say));
  const items=shuffle(sc.items);let idx=0,errs=0;
  const area=h('div',{class:'sortarea'});
  const deck=h('div',{class:'deck'});
  const bins=h('div',{class:'bins'});
  const gots={};
  sc.bins.forEach((b,bi)=>{
    const got=h('div',{class:'got'});gots[b.id]=got;
    bins.append(h('button',{class:'bin',style:`--c:${b.color}`,onclick:()=>put(b.id),'aria-label':b.label},
      h('span',{class:'kbd'},String(bi+1)),h('b',{},b.label),h('small',{},b.sub||''),got));
  });
  area.append(h('div',{class:'prog',id:'sp'}),deck,bins);ctx.host.append(area);
  let card=null,busy=false;
  function showCard(){
    deck.replaceChildren();
    if(idx>=items.length){
      const ok=errs===0;
      ctx.verdict(ok||errs<=2,(ok?'Zéro faute dans le tri. ':`${errs} erreur(s). `)+(sc.why||''));
      area.querySelector('#sp').textContent='';return;
    }
    area.querySelector('#sp').textContent=`Carte ${idx+1} / ${items.length}  ·  touche la bonne catégorie (ou les touches 1-${sc.bins.length})`;
    card=h('div',{class:'flip'},items[idx].t,items[idx].s?h('small',{},items[idx].s):null);deck.append(card);
  }
  async function put(id){
    if(busy||idx>=items.length||!ctx.alive())return;busy=true;
    const it=items[idx],ok=it.bin===id;
    if(ok){ctx.correct(8);}else{errs++;ctx.wrong();card.classList.add('shake');
      const rb=sc.bins.find(b=>b.id===it.bin);const tip=h('div',{class:'tip',html:`C'était plutôt : <b>${rb.label}</b>`});deck.append(tip);await sleep(1100);}
    if(!ctx.alive()){busy=false;return;}
    card.classList.remove('shake');card.classList.add('fly');sfx.pop();
    gots[it.bin].append(h('span',{},it.t.length>22?it.t.slice(0,21)+'…':it.t));
    await sleep(380);idx++;busy=false;if(ctx.alive())showCard();
  }
  const onKey=e=>{if(!ctx.alive()){document.removeEventListener('keydown',onKey);return;}const n=+e.key;if(n>=1&&n<=sc.bins.length)put(sc.bins[n-1].id);};
  document.addEventListener('keydown',onKey);
  showCard();
};

/* ---------- remettre dans l'ordre ---------- */
SCENES.order=(sc,ctx)=>{
  ctx.title(sc.title,'Ordre');
  if(sc.say)ctx.host.append(coach('think',sc.say));
  if(sc.intro)ctx.host.append(h('div',{class:'tip',html:sc.intro}));
  const n=sc.items.length;let next=0;
  const slots=h('div',{class:'slots'});
  const sl=sc.items.map((_,i)=>{const s=h('div',{class:'slot'},h('span',{class:'n'},String(i+1)),h('span',{},sc.slotLabel?sc.slotLabel(i):'…'));slots.append(s);return s;});
  const pool=h('div',{class:'pool'});
  const chips=shuffle(sc.items.map((it,i)=>({it,i}))).map(({it,i})=>{
    const c=h('button',{class:'chip',onclick:()=>tap(i,c)},it.t);pool.append(c);return c;});
  ctx.host.append(slots,h('div',{class:'prog'},'Touche les étapes dans le bon ordre, de la première à la dernière :'),pool);
  function tap(i,c){
    if(!ctx.alive())return;
    if(i===next){
      const s=sl[next];s.classList.add('filled');s.style.setProperty('--c',WCOL[(run.li+next)%WCOL.length]);
      s.children[1].textContent=sc.items[i].t+(sc.items[i].d?' - '+sc.items[i].d:'');
      c.disabled=true;ctx.correct(8);next++;
      if(next===n)ctx.verdict(true,sc.why||'');
    }else{ctx.wrong();c.classList.add('shake');setTimeout(()=>c.classList.remove('shake'),450);}
  }
};

/* ---------- associer ---------- */
SCENES.match=(sc,ctx)=>{
  ctx.title(sc.title,'Association');
  if(sc.say)ctx.host.append(coach('think',sc.say));
  const L=sc.pairs.map((p,i)=>({t:p[0],i})),R=shuffle(sc.pairs.map((p,i)=>({t:p[1],i})));
  let selL=null,done=0;
  const cl=h('div',{class:'col'}),cr=h('div',{class:'col'});
  const lb=L.map(o=>{const b=h('button',{class:'mbtn',onclick:()=>{if(b.classList.contains('ok'))return;lb.forEach(x=>x.classList.remove('sel'));b.classList.add('sel');selL=o.i;sfx.pop();},html:o.t});cl.append(b);return b;});
  const rb=R.map(o=>{const b=h('button',{class:'mbtn',onclick:()=>tapR(o,b),html:o.t});cr.append(b);return b;});
  ctx.host.append(h('div',{class:'prog'},'Touche un élément à gauche, puis son partenaire à droite.'),h('div',{class:'mcols'},cl,cr));
  function tapR(o,b){
    if(!ctx.alive()||b.classList.contains('ok'))return;
    if(selL==null){b.animate([{transform:'translateY(-3px)'},{transform:'none'}],{duration:200});return;}
    if(o.i===selL){
      const col=WCOL[(run.li+selL)%WCOL.length];
      [lb[selL],b].forEach(x=>{x.classList.remove('sel');x.classList.add('ok');x.style.setProperty('--c',col);});
      ctx.correct(8);selL=null;done++;
      if(done===L.length)ctx.verdict(true,sc.why||'');
    }else{ctx.wrong();b.classList.add('no');setTimeout(()=>b.classList.remove('no'),450);}
  }
};

/* ---------- boss : examen final chronométré ---------- */
SCENES.boss=(sc,ctx)=>{
  ctx.title('Examen du Data Ranger','Boss');
  const pool=[];LEVELS.forEach(L=>L.scenes.forEach(s=>{if(s.type==='quiz')pool.push(s);}));
  const qs=shuffle(pool).slice(0,10);let k=0,good=0;const T=25;
  const head=h('div',{class:'panel'},h('div',{class:'lab-l',style:'display:flex;justify-content:space-between;font-weight:700'},h('span',{id:'bq'}),h('span',{id:'bt',style:'font-family:var(--f-mono)'})),
    h('div',{class:'bar'},h('i',{id:'bb',style:'width:100%;--c:var(--sun);transition:none'})));
  const holder=h('div',{});
  ctx.host.append(coach('wow','Dernière épreuve ! <b>10 questions</b>, <b>25 secondes</b> chacune. Chaque erreur te coûte un cœur. Montre ce que tu sais.'),head,holder);
  let timer=null;
  function ask(){
    clearInterval(timer);holder.replaceChildren();
    if(k>=qs.length){
      ctx.host.append(ctx.verdict(good>=6,`Score : <b>${good} / ${qs.length}</b>. ${good>=9?'Presque parfait, tu maîtrises le cours.':good>=6?'Solide ! Rejoue pour viser le sans-faute.':'Retourne revoir les niveaux dont tu as douté, puis reviens.'}`,{label:'Terminer'}));
      $('#bq').textContent='Terminé';return;
    }
    $('#bq').textContent=`Question ${k+1} / ${qs.length}`;
    let t=T;const bb=$('#bb'),bt=$('#bt');bb.style.width='100%';bt.textContent=t+' s';
    const sc2=qs[k];
    const quiz=buildQuiz(sc2,ctx,{onAnswer:ok=>{clearInterval(timer);if(ok)good++;
      holder.append(h('div',{class:'verdict '+(ok?'ok':'ko')},h('p',{html:sc2.why||''}),h('div',{class:'row'},h('span'),h('button',{class:'btn',onclick:()=>{k++;if(ctx.alive())ask();}},k<qs.length-1?'Question suivante →':'Voir le score →'))));
    }});
    holder.append(quiz);
    timer=setInterval(()=>{
      if(!ctx.alive()){clearInterval(timer);return;}
      t--;bt.textContent=t+' s';bb.style.width=(t/T*100)+'%';
      if(t<=8)bb.style.setProperty('--c','var(--coral)');
      if(t<=0){clearInterval(timer);quiz.lock();quiz.reveal();ctx.wrong();
        if(ctx.alive())holder.append(h('div',{class:'verdict ko'},h('h4',{},'Temps écoulé !'),h('p',{html:sc2.why||''}),h('div',{class:'row'},h('span'),h('button',{class:'btn',onclick:()=>{k++;if(ctx.alive())ask();}},'Continuer →'))));}
    },1000);
    bb.style.setProperty('--c','var(--sun)');
  }
  ask();
};

/* ---------- état de lecture ---------- */
const readMap=()=>(S.read=S.read||{});
const courseData=()=>window.COURSE||[];
function allLessons(){const o=[];courseData().forEach((sh,si)=>sh.lessons.forEach((L,li)=>o.push({si,li,sh,L})));return o;}
function nextUnread(from){
  const a=allLessons(),r=readMap();
  const start=from==null?0:Math.max(0,a.findIndex(x=>x.si===from.si&&x.li===from.li)+1);
  for(let k=0;k<a.length;k++){const x=a[(start+k)%a.length];if(!r[x.L.id])return x;}
  return null;
}

/* ---------- les étagères ---------- */
function renderShelves(){
  run=null;app.replaceChildren();window.scrollTo(0,0);
  const data=courseData(),r=readMap(),all=allLessons();
  const readN=all.filter(x=>r[x.L.id]).length;
  let resume=null;
  if(S.cpos){const x=all.find(y=>y.si===S.cpos.si&&y.li===S.cpos.li);if(x&&!r[x.L.id])resume=S.cpos;}
  const nu=resume||nextUnread();
  const hero=h('header',{class:'hero'},
    h('div',{html:octet(readN?'happy':'think',110),style:'flex:none'}),
    h('div',{class:'txt'},
      h('h1',{html:'Le <em>Cours</em>'}),
      h('p',{},'Tout le cours du prof, réécrit simplement : une étagère par chapitre, un livre par leçon, et des étapes courtes avec schémas et exemples.'),
      h('div',{class:'stat-row'},
        h('span',{class:'pill',html:`Leçons lues <b>${readN}/${all.length}</b>`}),
        h('span',{class:'pill',html:`Étagères <b>${data.length}</b>`})),
      nu?h('button',{class:'btn sun big',onclick:()=>openLesson(nu.si,nu.li,resume&&nu.si===resume.si&&nu.li===resume.li?resume.st:0)},readN?'Continuer la lecture':'Commencer la lecture'):h('span',{class:'pill',html:'Tout le cours est lu <b>bravo !</b>'})));
  app.append(hero);
  const room=h('div',{class:'shelves'});
  data.forEach((sh,si)=>{
    const n=sh.lessons.length,d=sh.lessons.filter(L=>r[L.id]).length;
    const sec=h('section',{class:'shelf',style:`--c:${sh.c}`},
      h('div',{class:'shelf-h'},
        h('div',{class:'shelf-ic',html:sh.ic&&window.ICO&&ICO[sh.ic]?`<svg viewBox="0 0 40 40" aria-hidden="true">${ICO[sh.ic](sh.c)}</svg>`:''}),
        h('div',{class:'shelf-t'},h('small',{},`Étagère ${si+1}`),h('h2',{},sh.title),sh.sub?h('span',{class:'sub'},sh.sub):null),
        h('span',{class:'cnt'+(d===n?' full':'')},`${d}/${n}`)),
      h('div',{class:'books'},sh.lessons.map((L,li)=>{
        const done=!!r[L.id];
        return h('button',{class:'book'+(done?' read':''),style:`--k:${(li%3)}`,onclick:()=>{sfx.pop();openLesson(si,li,0);},'aria-label':`${L.title}${done?' (lu)':''}`},
          h('span',{class:'bn'},String(li+1)),
          h('span',{class:'bi',html:L.ic&&window.ICO&&ICO[L.ic]?`<svg viewBox="0 0 40 40" aria-hidden="true">${ICO[L.ic](sh.c)}</svg>`:''}),
          h('span',{class:'bt'},L.title),
          h('span',{class:'bm'},`${L.steps.length} étapes`),
          done?h('span',{class:'bchk',html:checkSvg}):null);
      })),
      h('div',{class:'plank'}));
    room.append(sec);
  });
  app.append(room,tabbar('course'));
}

/* ---------- lecteur de leçon ---------- */
let cur=null;
function openLesson(si,li,st=0){
  const sh=courseData()[si],L=sh&&sh.lessons[li];if(!L)return renderShelves();
  cur={si,li,st:Math.min(Math.max(0,st),L.steps.length-1)};
  app.replaceChildren();document.documentElement.style.setProperty('--wc',sh.c);
  const hud=h('div',{class:'hud'},
    h('button',{class:'btn small',onclick:()=>{cur=null;renderShelves();},'aria-label':'Retour aux étagères'},'← Étagères'),
    h('div',{class:'ttl'},h('small',{},`Étagère ${si+1} · ${sh.title}`),h('b',{},L.title)),
    h('div',{class:'track',id:'ltrack'}));
  const body=h('div',{id:'lbody',class:'lesson'});
  app.append(hud,body);
  renderStep();
}
function renderStep(anim=true){
  const {si,li,st}=cur,sh=courseData()[si],L=sh.lessons[li],S0=L.steps[st],last=st===L.steps.length-1;
  S.cpos={si,li,st};save();
  const tr=$('#ltrack');tr.replaceChildren();
  L.steps.forEach((_,i)=>{const b=h('i',{class:i<st?'done':i===st?'now':'',role:'button','aria-label':`Étape ${i+1}`,onclick:()=>{cur.st=i;renderStep();}});tr.append(b);});
  let html='';
  try{html=[].concat(S0.b()).join('');}catch(err){console.error(err);html='<p>Oups, un schéma n\'a pas pu s\'afficher.</p>';}
  const card=h('article',{class:'lcard'+(anim?' rise':'')},
    h('div',{class:'lstep'},`Étape ${st+1} sur ${L.steps.length}`),
    h('h2',{},S0.t),
    h('div',{class:'lbody',html}));
  const nav=h('div',{class:'lnav'},
    h('button',{class:'btn',disabled:st===0,onclick:()=>go(-1)},'← Précédent'),
    last?h('button',{class:'btn mint',onclick:finishLesson},'J\'ai fini la leçon ✓'):h('button',{class:'btn sun',onclick:()=>go(1)},'Suivant →'));
  const host=$('#lbody');host.replaceChildren(card,nav);
  window.scrollTo(0,0);
  if(REDUCED)host.querySelectorAll('svg').forEach(s=>{try{s.pauseAnimations()}catch(e){}});
}
function go(d){
  if(!cur)return;const L=courseData()[cur.si].lessons[cur.li],n=cur.st+d;
  if(n<0||n>=L.steps.length)return;cur.st=n;sfx.pop();renderStep();
}
function finishLesson(){
  const {si,li}=cur,sh=courseData()[si],L=sh.lessons[li],r=readMap(),first=!r[L.id];
  r[L.id]=true;if(first)S.xp+=10;delete S.cpos;save();
  sfx.win();confetti(70);
  const nx=nextUnread({si,li});
  const lv=L.lv!=null&&window.LEVELS&&LEVELS[L.lv]?L.lv:null;
  const card=h('article',{class:'lcard rise',style:'text-align:center'},
    h('div',{html:octet('happy',100),style:'display:flex;justify-content:center'}),
    h('h2',{},'Leçon terminée !'),
    h('p',{class:'lead'},first?'+10 XP. Tu peux la relire quand tu veux, elle reste sur l\'étagère.':'Relue avec succès.'),
    h('div',{class:'lnav',style:'justify-content:center'},
      nx&&!(nx.si===si&&nx.li===li)?h('button',{class:'btn sun',onclick:()=>openLesson(nx.si,nx.li,0)},`Leçon suivante : ${nx.L.title}`):null,
      lv!=null?(levelUnlocked(lv)?h('button',{class:'btn mint',onclick:()=>startLevel(lv)},`Jouer le niveau « ${LEVELS[lv].title} »`):h('div',{class:'tip'},`Pour t'entraîner : niveau « ${LEVELS[lv].title} » dans l'Aventure.`)):null,
      h('button',{class:'btn ghost',onclick:()=>{cur=null;renderShelves();}},'Retour aux étagères')));
  $('#lbody').replaceChildren(card);
  window.scrollTo(0,0);
}
/* flèches du clavier et balayage tactile */
document.addEventListener('keydown',e=>{if(cur&&$('#lbody')&&(e.key==='ArrowRight'||e.key==='ArrowLeft')&&!e.target.closest('input,textarea'))go(e.key==='ArrowRight'?1:-1);});
(()=>{let x0=null,y0=null;
  document.addEventListener('touchstart',e=>{if(!cur||e.touches.length!==1)return;if(e.target.closest('.tblw,pre'))return;x0=e.touches[0].clientX;y0=e.touches[0].clientY;},{passive:true});
  document.addEventListener('touchend',e=>{if(x0==null||!cur)return;const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;x0=null;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.8)go(dx<0?1:-1);},{passive:true});
})();

/* =====================================================================
   DÉMARRAGE : déverrouillage du contenu chiffré, service worker, installation
   ===================================================================== */
const PASS_KEY='bdquest-pass';
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decryptPack(pack,pass){
  const enc=new TextEncoder();
  const km=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(pack.salt),iterations:pack.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(pack.iv)},key,b64(pack.data));
  return new TextDecoder().decode(buf);
}
function gate(inner){
  app.replaceChildren(h('div',{style:'min-height:80vh;display:grid;place-items:center'},h('div',{class:'card',style:'max-width:420px;width:100%;text-align:center;display:grid;gap:14px;justify-items:center'},inner)));
}
function showMsg(t){gate([h('div',{html:octet('think',90)}),h('p',{style:'margin:0'},t)]);}
function askPass(pack,errMsg){
  return new Promise(resolve=>{
    const inp=h('input',{type:'password',id:'pw',autocomplete:'current-password','aria-label':'Mot de passe',placeholder:'Mot de passe',style:'width:100%;box-sizing:border-box;font-size:18px;text-align:center'});
    const err=h('div',{style:'color:#b3261e;font-weight:700;min-height:22px'},errMsg||'');
    const go=h('button',{class:'btn sun big',type:'submit'},'Déverrouiller');
    const form=h('form',{style:'display:grid;gap:12px;width:100%;justify-items:center'},inp,err,go);
    form.addEventListener('submit',async e=>{
      e.preventDefault();go.disabled=true;err.textContent='';
      try{const code=await decryptPack(pack,inp.value);try{localStorage.setItem(PASS_KEY,inp.value);}catch(_){}resolve(code);}
      catch(_){err.textContent='Mot de passe incorrect.';go.disabled=false;inp.select();form.animate([{transform:'translateX(-8px)'},{transform:'translateX(8px)'},{transform:'none'}],{duration:260});}
    });
    gate([h('div',{html:octet('wow',100)}),h('h2',{style:'font-size:30px'},'Big Data Quest'),h('p',{style:'margin:0'},'Contenu privé. Entre ton mot de passe (une seule fois sur cet appareil).'),form]);
    inp.focus();
  });
}
let deferredInstall=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;const f=document.querySelector('.foot');if(f)window.__footHook(f);});
window.addEventListener('appinstalled',()=>{deferredInstall=null;const b=document.getElementById('instbtn');if(b)b.remove();});
window.__footHook=foot=>{
  if(!deferredInstall||document.getElementById('instbtn'))return;
  foot.prepend(h('button',{id:'instbtn',class:'btn sun small',onclick:async()=>{deferredInstall.prompt();try{await deferredInstall.userChoice;}catch(_){}deferredInstall=null;const b=document.getElementById('instbtn');if(b)b.remove();}},'Installer l\'application'));
};
async function boot(){
  if('serviceWorker' in navigator){try{navigator.serviceWorker.register('sw.js');}catch(_){}}
  showMsg('Chargement…');
  let pack;
  try{const r=await fetch('content.enc.json',{cache:'no-cache'});if(!r.ok)throw new Error(r.status);pack=await r.json();}
  catch(e){showMsg('Impossible de charger le contenu. Connecte-toi à internet pour la première ouverture.');return;}
  let code=null,saved=null;
  try{saved=localStorage.getItem(PASS_KEY);}catch(_){}
  if(saved){try{code=await decryptPack(pack,saved);}catch(_){code=null;}}
  if(!code)code=await askPass(pack,saved?'Le contenu a changé de mot de passe, saisis le nouveau.':'');
  try{(0,eval)(code);}catch(e){console.error(e);showMsg('Erreur dans le contenu du jeu.');return;}
  window.__bd={LEVELS,startLevel,renderMap,S,goto(li,si){startLevel(li);run.si=si;renderScene();},get run(){return run;}};
  renderMap();
}
boot();
