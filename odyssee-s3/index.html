<style>
:root{--bg:#EEF0F6;--card:#fff;--ink:#151A2C;--muted:#5B6382;--line:#D3D8E6;--acc:#2A63F0;--bad:#D03E3E}
@media (prefers-color-scheme:dark){:root{--bg:#0D1020;--card:#151A2E;--ink:#ECEEF8;--muted:#959CBC;--line:#2A3156;--acc:#5B8BFF;--bad:#F06A6A;color-scheme:dark}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px;width:min(380px,100%);display:flex;flex-direction:column;gap:14px}
.logo{width:44px;height:44px;border-radius:12px;background:var(--ink);color:var(--card);display:grid;place-items:center}
h1{font-size:1.3rem;margin:0}p{margin:0;color:var(--muted);font-size:.9rem}
input{font:inherit;color:inherit;background:transparent;border:1.5px solid var(--line);border-radius:11px;padding:11px 12px;width:100%}
input:focus{outline:2px solid var(--acc);outline-offset:1px}
button{font:inherit;font-weight:700;border:0;border-radius:11px;padding:11px;background:var(--acc);color:#fff;cursor:pointer}
button[disabled]{opacity:.6;cursor:wait}
.err{color:var(--bad);font-size:.85rem;min-height:1.2em}
.foot{font-size:.75rem;color:var(--muted)}
</style>
