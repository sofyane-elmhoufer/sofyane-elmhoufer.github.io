name: Signal daily edition
on:
  schedule:
    - cron: '10 0 * * *'   # 00:10 UTC every day (about 01:10 in Morocco)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: signal-daily
  cancel-in-progress: false
jobs:
  edition:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: signal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build today's edition
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/update.mjs
      - name: Commit the new encrypted data
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add data.enc.json
          if git diff --cached --quiet; then echo "no change"; else git commit -m "Signal: daily edition $(date -u +%F)" && git pull --rebase origin main && git push; fi
