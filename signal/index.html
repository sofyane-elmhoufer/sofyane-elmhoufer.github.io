<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0D0F2B">
<title>The Signal</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..600&display=swap">
<style>
:root{--ink:#ECEEFF;--paper:#0D0F2B;--blue:#7C8CFF;--pink:#FF6FB5;--yellow:#FFD60A}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif}
#lock{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;position:relative;overflow:hidden}
#lock svg.wave{position:absolute;inset:auto 0 12% 0;width:100%;height:160px;opacity:.55;pointer-events:none}
#lock svg.wave path{fill:none;stroke:var(--pink);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 3.2s .2s cubic-bezier(.3,.7,.2,1) forwards}
#lock svg.wave path.b{stroke:var(--blue);transform:translate(5px,4px);animation-delay:.35s}
@keyframes draw{to{stroke-dashoffset:0}}
#f{position:relative;width:min(420px,100%);display:grid;gap:14px}
#f h1{font-size:clamp(54px,14vw,84px);line-height:.9;margin:0 0 4px;letter-spacing:-.04em;font-weight:800;color:var(--blue);text-shadow:4px 3px 0 var(--pink)}
#f p.sub{margin:0 0 8px;color:#B3B7E6;font-size:17px}
#pw{font:inherit;font-size:18px;padding:14px 16px;border-radius:10px;border:2px solid #3a3f86;background:#161940;color:var(--ink);outline:none;width:100%}
#pw:focus{border-color:var(--yellow)}
.rm{display:flex;gap:10px;align-items:center;font-size:14px;color:#B3B7E6}
#go{font:inherit;font-weight:700;font-size:18px;padding:14px;border:0;border-radius:10px;background:var(--yellow);color:#14163A;cursor:pointer}
#go:disabled{opacity:.6;cursor:progress}
#go:focus-visible,#pw:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
#err{min-height:22px;margin:0;color:var(--pink);font-size:15px}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@media (prefers-reduced-motion:reduce){#lock svg.wave path{animation:none;stroke-dashoffset:0}.shake{animation:none}}
noscript{display:block;padding:24px}
</style>
<script>window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();window.__installEvt=e;window.dispatchEvent(new Event('installready'))});window.addEventListener('appinstalled',function(){window.__installEvt=null;window.dispatchEvent(new Event('installready'))});</script>
</head>
<body>
<div id="lock">
  <svg class="wave" viewBox="0 0 800 160" preserveAspectRatio="none" aria-hidden="true">
    <path class="b" d="M0 80 H220 L250 80 L270 20 L300 140 L330 50 L350 80 H520 L540 80 L560 40 L585 120 L605 80 H800"/>
    <path d="M0 80 H220 L250 80 L270 20 L300 140 L330 50 L350 80 H520 L540 80 L560 40 L585 120 L605 80 H800"/>
  </svg>
  <form id="f" autocomplete="on">
    <h1>The Signal</h1>
    <p class="sub">Your private daily briefing on AI &amp; data. Enter your password to open it.</p>
    <input id="pw" type="password" autocomplete="current-password" aria-label="Password" placeholder="Password" required autofocus>
    <label class="rm"><input id="rm" type="checkbox"> Keep this device unlocked for 30 days</label>
    <button id="go" type="submit">Unlock</button>
    <p id="err" role="alert"></p>
  </form>
</div>
<noscript>This app needs JavaScript to decrypt its content.</noscript>
<script>
(() => {
'use strict';
const AAD_APP = 'signal-app-v1', AAD_DATA = 'signal-data-v1', DAYS = 30;
const $ = (id) => document.getElementById(id);
const te = new TextEncoder();
const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

async function deriveKey(pw, env) {
  const base = await crypto.subtle.importKey('raw', te.encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: unb64(env.salt), iterations: env.iter, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
}
async function decrypt(env, key, aad) {
  if (env.aad !== aad) throw new Error('bad-label');
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(env.iv), additionalData: te.encode(aad) }, key, unb64(env.data));
  const raw = env.gz ? await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer() : plain;
  return JSON.parse(new TextDecoder().decode(raw));
}

// "Keep unlocked": a non-extractable CryptoKey in IndexedDB (the password itself is never stored).
const idb = () => new Promise((res, rej) => { const r = indexedDB.open('signal', 1); r.onupgradeneeded = () => r.result.createObjectStore('k'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
async function keyGet() { try { const db = await idb(); return await new Promise((res) => { const q = db.transaction('k').objectStore('k').get('main'); q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); }); } catch { return null; } }
async function keyPut(key, salt) { try { const db = await idb(); db.transaction('k', 'readwrite').objectStore('k').put({ key, salt, exp: Date.now() + DAYS * 864e5 }, 'main'); } catch {} }
async function keyDel() { try { const db = await idb(); db.transaction('k', 'readwrite').objectStore('k').delete('main'); } catch {} }

function start(bundle, key) {
  window.__SIGNAL = {
    key,
    async loadData(bust) {
      const r = await fetch('data.enc.json' + (bust ? '?t=' + Date.now() : ''), { cache: bust ? 'no-store' : 'default' });
      if (!r.ok) throw new Error('data ' + r.status);
      return decrypt(await r.json(), key, AAD_DATA);
    },
    async lock() { await keyDel(); location.reload(); }
  };
  $('lock').remove();
  document.documentElement.setAttribute('data-app', '1');
  document.body.insertAdjacentHTML('beforeend', bundle.html);
  const st = document.createElement('style'); st.textContent = bundle.css; document.head.appendChild(st);
  const sc = document.createElement('script'); sc.textContent = bundle.js; document.body.appendChild(sc);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
}

let appEnv = null;
const appFetch = fetch('app.enc.json', { cache: 'no-cache' }).then((r) => { if (!r.ok) throw new Error('app ' + r.status); return r.json(); }).then((e) => (appEnv = e));

(async () => {
  const saved = await keyGet();
  if (!saved) return;
  try {
    const env = await appFetch;
    if (saved.exp < Date.now() || saved.salt !== env.salt) throw 0;
    start(await decrypt(env, saved.key, AAD_APP), saved.key);
  } catch (e) { if (e === 0 || e?.name === 'OperationError') keyDel(); }
})();

let fails = 0;
$('f').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const go = $('go'), err = $('err'), pw = $('pw');
  go.disabled = true; err.textContent = '';
  if (fails >= 3) { err.textContent = 'Too many tries. Wait a few seconds…'; await new Promise((r) => setTimeout(r, Math.min(15000, fails * 2000))); err.textContent = ''; }
  try {
    const env = await appFetch;
    const key = await deriveKey(pw.value, env);
    const bundle = await decrypt(env, key, AAD_APP);
    if ($('rm').checked) await keyPut(key, env.salt);
    start(bundle, key);
  } catch (e) {
    fails++;
    go.disabled = false;
    if (e?.name === 'OperationError') { err.textContent = 'Wrong password. Try again.'; $('f').classList.remove('shake'); void $('f').offsetWidth; $('f').classList.add('shake'); pw.select(); }
    else err.textContent = 'Could not load the app files. Check your connection and retry.';
  }
});
})();
</script>
</body>
</html>
